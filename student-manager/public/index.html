<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVERA Compass</title>
<style>
  :root { --navy:#0B1B45; --gold:#C9A227; --bg:#f4f5f8; --card:#fff; --border:#d7d9de; --muted:#6b7280;
          --error:#d9534f; --ok:#1d9e75; --warn:#d98a00; --soft:#eef0f5; }
  * { box-sizing:border-box; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:var(--bg); margin:0; color:#222; font-size:14px; }
  button, input, select, textarea { font-family:inherit; font-size:14px; }
  a { color:var(--navy); }

  header.top { background:var(--navy); color:#fff; position:sticky; top:0; z-index:20; }
  .top-in { max-width:1200px; margin:0 auto; padding:9px 16px; /* 머리글·메뉴는 모든 화면에서 가운데 같은 폭 (메인 본문만 넓게) */ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { font-weight:bold; font-size:1.05rem; white-space:nowrap; }
  .brand span { color:var(--gold); }
  #nav { background:#fff; color:#333; border-bottom:1px solid var(--border); }
  #nav:empty { display:none; }
  .navrow-o + .navrow-o { border-top:1px solid var(--soft); }
  .navrow { max-width:1200px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .navrow .nl { font-size:.72rem; color:var(--muted); width:40px; flex-shrink:0; }
  .navrow a { color:#4a5468; text-decoration:none; padding:9px 12px 7px; white-space:nowrap; border-bottom:3px solid transparent; font-size:.9rem; }
  .navrow a:hover { color:var(--navy); }
  .navrow a.on { color:var(--navy); font-weight:bold; border-bottom-color:var(--gold); }
  .um { position:relative; font-size:.85rem; }
  .um-btn { background:transparent; border:1px solid #5a6890; color:#fff; border-radius:18px; padding:4px 10px 4px 4px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .av { width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--navy); font-weight:bold; display:inline-flex; align-items:center; justify-content:center; font-size:.78rem; }
  .um-menu { display:none; position:absolute; right:0; top:100%; padding-top:6px; z-index:45; }
  .um:hover .um-menu, .um.open .um-menu { display:block; }
  .um-box { background:#fff; color:#222; border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); min-width:200px; overflow:hidden; }
  .um-h { padding:10px 14px; border-bottom:1px solid var(--soft); font-size:.8rem; color:var(--muted); }
  .um-h b { color:#222; font-size:.9rem; }
  .um-box a { display:block; padding:9px 14px; color:#333; text-decoration:none; cursor:pointer; letter-spacing:.02em; }
  .um-box a + a { border-top:1px solid var(--soft); }
  .um-box a:hover { background:#f4f6fa; }

  main { max-width:1200px; margin:0 auto; padding:16px; }
  h2 { font-size:1.1rem; color:var(--navy); margin:4px 0 12px; }
  h3 { font-size:.95rem; color:var(--navy); margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .grid { display:grid; gap:14px; }
  .grid > * { min-width:0; }
  .nw { white-space:nowrap; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:820px) { .g2, .g4 { grid-template-columns:1fr 1fr; } .g2 { grid-template-columns:1fr; } }

  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; }
  .stat .n { font-size:1.6rem; font-weight:bold; color:var(--navy); }
  .stat .l { font-size:.8rem; color:var(--muted); }
  .stat.alert .n { color:var(--error); }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .grow { flex:1; min-width:180px; }
  input[type=text], input[type=date], input[type=email], input[type=tel], input[type=password], select, textarea {
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
  .toolbar select { width:auto; }

  .btn { padding:8px 14px; border-radius:6px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; white-space:nowrap; }
  .btn.ghost { background:#fff; color:var(--navy); }
  a.btn { display:inline-block; text-decoration:none; }
  .btn.danger { background:#fff; color:var(--error); border-color:var(--error); }
  .btn.sm { padding:4px 9px; font-size:.8rem; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--soft); vertical-align:top; }
  th { font-size:.78rem; color:var(--muted); font-weight:normal; white-space:nowrap; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:#fafbfd; }
  tr.click[style]:hover td { background:rgba(0,0,0,.05); } /* 관리팀 색이 있는 줄은 색을 유지한 채 살짝 어둡게 */
  .tbl-wrap { overflow-x:auto; }
  /* 표 맨 오른쪽 버튼 칸은 표가 옆으로 밀려도 항상 보이게 */
  .tbl-wrap table tr > td:last-child:has(.btn), .tbl-wrap table:has(td:last-child .btn) tr > th:last-child { position:sticky; right:0; background:#fff; box-shadow:-8px 0 8px -8px rgba(0,0,0,.18); z-index:1; }
  /* 긴 내용은 2줄까지, 누르면 펼침 */
  td.clip { min-width:220px; cursor:pointer; }
  th.ck, td.ck { width:26px; padding-right:0; } td.ck input, th.ck input { width:16px; height:16px; margin:0; }
  tr.sel td { background:#f3f6fd; }
  .dfile { padding:1px 4px; border-radius:4px; } .dfile.sel { background:#e3eafa; } .dfile input { vertical-align:middle; margin:0 2px 0 0; }
  .selbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 10px; margin-bottom:8px; background:#eef2fb; border:1px solid #cfd8ee; border-radius:8px; font-size:.88rem; font-weight:600; }
  td.clip > div { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  td.clip.open > div { display:block; }
  td.clip:not(.open):hover > div { color:#1f3b8a; }

  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.75rem; background:var(--soft); color:#333; white-space:nowrap; }
  .pill.s-상담중 { background:var(--soft); color:#374151; }
  .pill.s-진행중 { background:#e6f6ef; color:#0f7a55; }
  .pill.s-보류 { background:#fff4e0; color:#a56200; }
  .pill.s-완료, .pill.s-종료 { background:#eee; color:#666; }
  .pill.a-합격 { background:#e6f6ef; color:#0f7a55; }
  .pill.a-불합격, .pill.a-철회 { background:#eee; color:#666; }
  .pill.a-제출완료 { background:var(--soft); color:var(--navy); font-weight:bold; }
  .pill.a-대기 { background:#fff4e0; color:#a56200; }
  .tz-res { display:grid; gap:2px; margin-top:4px; max-height:260px; overflow:auto; }
  .tz-hit { text-align:left; background:var(--soft, #f5f7fb); border:1px solid transparent; border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  .tz-hit:hover, .tz-hit:focus-visible { border-color:#9fb3d9; } .tz-hit:disabled { opacity:.55; cursor:default; }
  .pill.a-보류 { background:#f1f1f4; color:#5b5f6b; border:1px dashed #b5b9c4; }
  .dday { font-weight:bold; white-space:nowrap; }
  .dday.over { color:var(--error); }
  .dday.soon { color:var(--warn); }
  .dday.far { color:#8a919e; font-weight:normal; }
  .muted { color:var(--muted); font-size:.82rem; }
  .tag { display:inline-block; font-size:.72rem; background:#f6f7f9; border:1px solid #e3e5ea; color:#4b5563; border-radius:4px; padding:0 5px; margin-right:3px; }
  .empty { color:var(--muted); text-align:center; padding:18px; font-size:.85rem; }

  .tabs { display:flex; gap:4px; box-shadow:inset 0 -2px 0 var(--soft); margin-bottom:12px; }
  .tabs a { padding:8px 14px; text-decoration:none; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; }
  .tabs a.on { color:var(--navy); border-color:var(--gold); font-weight:bold; }

  .note { border-left:3px solid var(--gold); padding:8px 12px; margin-bottom:12px; background:#fcfcfd; border-radius:0 6px 6px 0; }
  .note .meta { font-size:.78rem; color:var(--muted); margin-bottom:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .note .body { white-space:pre-wrap; line-height:1.55; max-height:24em; overflow:auto; }
  /* 길어지는 글 칸은 일정 높이를 넘으면 그 안에서 스크롤 */
  .longtxt { max-height:11em; overflow:auto; white-space:pre-wrap; }
  .appinfo td, .pg td, .th-b, .sentck + div { overflow-wrap:anywhere; }
  .note .next { margin-top:6px; font-size:.85rem; background:#fffaf0; padding:6px 8px; border-radius:4px; }
  .note .acts { margin-left:auto; display:flex; gap:4px; }

  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:.88rem; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; white-space:pre-wrap; word-break:break-all; }

  .todo { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--soft); }
  .todo input { margin-top:3px; width:16px; height:16px; }
  .todo .t { flex:1; }

  /* modal */
  .ov { position:fixed; inset:0; background:rgba(11,27,69,.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:30px 12px; overflow-y:auto; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:620px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size:1.05rem; margin-bottom:14px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .form .full { grid-column:1 / -1; }
  .form label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:3px; }
  .form label b { color:var(--error); }
  @media (max-width:560px) { .form { grid-template-columns:1fr; } }
  .modal .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .modal .foot .left { margin-right:auto; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:8px; z-index:60; display:none; max-width:90vw; font-size:.88rem; }
  #toast.err { background:var(--error); }
  #loading { position:fixed; top:0; left:0; right:0; height:3px; background:var(--gold); z-index:70; display:none; animation:ld 1s infinite linear; }
  @keyframes ld { 0% { opacity:.3 } 50% { opacity:1 } 100% { opacity:.3 } }
  #gate { min-height:80vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  #gate .card { max-width:460px; }
  .login { width:100%; max-width:380px; text-align:left; padding:28px 26px; }
  .login .logo { background:var(--navy); color:#fff; padding:12px; border-radius:40px; font-weight:bold; text-align:center; margin-bottom:20px; }
  .login .logo span { color:var(--gold); }
  .login label { display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px; }
  .login .btn { width:100%; margin-top:18px; padding:12px; font-size:1rem; }
  .login .msg { color:var(--error); font-size:.85rem; min-height:20px; margin-top:10px; }
  .tabs { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  @media (max-width:820px) { .dropbox.sm .dnd { display:none; } }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs a { white-space:nowrap; padding:8px 10px; }
  .sec-h { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
  .sec-h h3 { margin:0; }
  .multi { display:flex; flex-wrap:wrap; gap:6px 14px; padding:4px 0; }
  .form .multi label { display:inline-flex; align-items:center; gap:4px; font-size:.86rem; color:#222; margin:0; }
  .role { font-size:.72rem; padding:1px 6px; border-radius:4px; background:#5a6890; color:#fff; }
  .contract { border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:10px; cursor:pointer; }
  .contract:hover { background:#fafbfd; }
  .contract .h { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .money { font-weight:bold; color:var(--navy); }
  .pill.p-납부 { background:#e6f6ef; color:#0f7a55; }
  .pill.p-미납 { background:#fdecec; color:#b42318; }
  .pill.d-수합 { background:#e6f6ef; color:#0f7a55; }
  .pill.d-해당 { background:#eee; color:#666; }
  .pill.d-요청함 { background:#fff4e0; color:#a56200; }
  .pill.d-미확정 { background:#fdecec; color:#b42318; }
  .pill.prog { background:#fff; color:var(--navy); border:1px solid #c7cbd6; }
  .chks { margin-top:10px; padding-top:10px; border-top:1px solid var(--soft); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chk { font-size:.75rem; padding:2px 9px; border-radius:10px; cursor:pointer; border:1px solid var(--border); }
  .chk.ok { background:#e6f6ef; color:#0f7a55; border-color:#bfe6d3; }
  .chk.no { background:#fff; color:#9aa0aa; border-style:dashed; }
  .cbar { display:inline-block; width:54px; height:6px; background:var(--soft); border-radius:3px; vertical-align:middle; overflow:hidden; }
  .cbar span { display:block; height:100%; background:var(--ok); }
  table.mat th.c, table.mat td.c { text-align:center; }
  .mk { display:inline-block; width:26px; height:26px; line-height:26px; border-radius:50%; cursor:pointer; font-weight:bold; }
  .mk.ok { background:#e6f6ef; color:#0f7a55; }
  .mk.no { color:#c4c8cf; }
  tr.grp td { background:var(--soft); font-weight:bold; color:var(--navy); font-size:.85rem; }
  .pays { margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); }
  .form .fh { font-size:.82rem; font-weight:bold; color:var(--navy); border-top:1px solid var(--soft); padding-top:10px; margin-top:4px; }
  .form .fh:empty { padding-top:0; }
  .owners { margin-left:6px; padding:1px 8px; background:var(--soft); border-radius:10px; font-size:.75rem; color:#444; }
  .pill.prem { background:#C9A227; color:#0B1B45; font-weight:bold; }
  .progress-box { margin-top:10px; padding:8px 12px; background:#f7f9fc; border-left:3px solid var(--navy); border-radius:0 6px 6px 0; font-size:.88rem; white-space:pre-wrap; }
  .progress-box .btn { margin-left:6px; }
  .progress-line { background:#f7f9fc; padding:6px 10px; border-radius:6px; font-size:.86rem; margin-bottom:6px; white-space:pre-wrap; }
  .quick { display:grid; grid-template-columns:1fr 150px 140px auto; gap:6px; margin-bottom:10px; }
  @media (max-width:640px) { .quick { grid-template-columns:1fr 1fr; } .quick input[type=text] { grid-column:1 / -1; } }
  .fu { display:flex; gap:10px; padding:8px 4px; border-bottom:1px solid var(--soft); align-items:flex-start; }
  .fu input { margin-top:4px; width:16px; height:16px; flex-shrink:0; }

  .acts-list { max-height:320px; overflow-y:auto; }

  .scroll-box { max-height:340px; overflow-y:auto; }
  .scroll-box.sm { max-height:260px; }
  .scroll-box thead th { position:sticky; top:0; background:#fff; z-index:1; }
  table.compact td, table.compact th { padding:6px 6px; }
  .gsearch { position:relative; flex:0 1 440px; min-width:180px; margin-left:auto; }
  @media (max-width:700px) { .gsearch { order:3; flex:1 1 100%; margin-left:0; } .um { margin-left:auto; } }

  .gsall { display:block; padding:8px 12px; text-align:center; font-size:.8rem; border-top:1px solid var(--soft); }
  .form input[readonly] { background:var(--soft); color:#555; }
  .cycbar { margin-top:10px; padding-top:10px; border-top:1px solid var(--soft); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

function post(url, body) {

function cutError() { var e = new Error(CUT_MSG); e.cut = true; return e; }
function handle(res) {
  checkVersion(res.headers.get('X-App-Version'));
  return res.text().then(function (txt) {
    try { return txt ? JSON.parse(txt) : null; } catch (e) { return null; }
  }, function () { return null; }).then(function (data) {
    busy(false);
    if (res.ok && !data) throw cutError();
    data = data || {};
    if (res.ok) return data;
    if (data.needLogin) showLogin();

  });
}

function checkVersion(v) {
  if (!v) return;
  if (!APP_VER) { APP_VER = v; return; }
  if (v === APP_VER || $('newver')) return;

/** 팔로업 분류 (목록 관리 › 팔로업 분류) */
function fuCats() { return optionList('fucat'); }
/** 분류별 보기: 같은 분류의 팔로업·받은 연락을 한 묶음으로 — 머리줄에 분류·건수·답변·파일·최근 날짜 (목록 관리 순서, 분류 없음은 맨 끝) */
function catGroups(s, list) {
  var order = fuCats(), groups = [], byC = {};
  list.forEach(function (f) { var k = f.category || ''; if (!byC[k]) { byC[k] = []; groups.push(k); } byC[k].push(f); });
  var pos = function (k) { var i = order.indexOf(k); return k === '' ? 1e6 : i < 0 ? 1e5 : i; };
  groups.sort(function (a, b) { return pos(a) - pos(b) || a.localeCompare(b); });
  if (!groups.length) return '<div class="empty">기록이 없습니다.</div>';
  UI.noTopicChip = true;
  var out = groups.map(function (k) {
    var items = byC[k].slice().sort(function (a, b) { return ((a.status === '완료') - (b.status === '완료')) || (a.createdAt || '').localeCompare(b.createdAt || ''); });
    var nOpen = items.filter(function (f) { return f.status !== '완료'; }).length;
    var nRep = items.reduce(function (n, f) { return n + repliesOf(f.id).length; }, 0);
    var nFile = items.reduce(function (n, f) { return n + S.files.filter(function (x) { return x.followupId === f.id; }).length; }, 0);
    var lt = items.map(function (f) { var r = repliesOf(f.id); return [f.updatedAt || '', r.length ? r[r.length - 1].createdAt : ''].sort().pop(); }).sort().pop() || '';
    var add = k ? '<span class="tg-add" onclick="event.preventDefault();event.stopPropagation()"><button class="ibtn" title="이 분류로 팔로업 추가" onclick="openForm(\'followups\',null,' + js(s.id) + ',{category:' + js(k) + '})">+ 팔로업</button>' +
      '<button class="ibtn" title="이 분류로 받은 연락 추가" onclick="openForm(\'contact\',null,' + js(s.id) + ',{category:' + js(k) + '})">+ 📩 연락</button></span>' : '';
    return '<details class="topic-g"' + (nOpen || !k ? ' open' : '') + '><summary><span class="tg-h">' + (k ? '<span class="futopic"><b>분류</b></span> <b>' + esc(k) + '</b>' : '<span class="muted">분류 없음</span>') + '</span>' +
      '<span class="muted">' + items.length + '건' + (nOpen ? ' · 남은 ' + nOpen : ' · 모두 완료') + (nRep ? ' · 💬 ' + nRep : '') + (nFile ? ' · 📎 ' + nFile : '') + (lt ? ' · 최근 ' + esc(fmtD(lt.slice(0, 10))) : '') + '</span>' + add + '</summary>' +
      items.map(function (f) { return fuRow(f, false); }).join('') + '</details>';
  }).join('');
  UI.noTopicChip = false;
  return out;
}
/** 검색: 팔로업 하나가 q 와 맞는지 (주제·할 일·받은 내용·답변·첨부파일 이름) */
function fuHit(f, q) {
  var s = studentById(f.studentId);
  var text = [f.topic, f.title, f.detail, f.category, f.fromWho, s && s.name, teacherName(f.assignee)].concat(repliesOf(f.id).map(function (x) { return x.content + ' ' + x.who; }))
    .concat(S.files.filter(function (x) { return x.followupId === f.id; }).map(function (x) { return x.name; }));
  return text.join(' ').toLowerCase().indexOf(q) >= 0;
}
/** 검색어 앞뒤 글 + 강조 */
function hlSnip(text, q, w) {
  text = String(text || '').replace(/\s+/g, ' '); w = w || 50;
  var i = text.toLowerCase().indexOf(q); if (i < 0) return null;
  var a = Math.max(0, i - w), b = Math.min(text.length, i + q.length + w);
  return (a ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}
/** 검색 결과 줄 아래: 걸린 문장(어느 답변인지)과 걸린·붙은 파일 */
function fuHitBox(f, q) {
  var lines = [];
  var d = hlSnip(f.detail, q); if (d && f.detail.trim() !== f.title) lines.push('<div><span class="muted">' + (f.kind === 'contact' ? '받은 내용' : '세부') + '</span> ' + d + '</div>');
  repliesOf(f.id).forEach(function (x) {
    var fs = replyFiles(x.id), hit = hlSnip(x.content, q), fhit = fs.filter(function (y) { return y.name.toLowerCase().indexOf(q) >= 0; });
    if (hit || fhit.length) lines.push('<div class="hit-r' + (OUR_SIDE[x.who] ? ' ours' : '') + '"><b>💬 ' + esc(replyWho(x)) + '</b> <span class="muted">' + esc(x.date ? fmtD(x.date) : fmtTime(x.createdAt)) + '</span> ' + (hit || '') +
      (fhit.length ? '<div class="th-files">' + fhit.map(fileThumb).join('') + '</div>' : '') + '</div>');
  });
  var loose = S.files.filter(function (x) { return x.followupId === f.id && !x.replyId && x.name.toLowerCase().indexOf(q) >= 0; });
  if (loose.length) lines.push('<div class="th-files">' + loose.map(fileThumb).join('') + '</div>');
  return lines.length ? '<div class="fu-hits" onclick="openForm(' + js(f.kind === 'contact' ? 'contact' : 'followups') + ',' + js(f.id) + ')">' + lines.join('') + '</div>' : '';
}

/* ----- 팔로업 트래커 (전체 학생) ----- */
function viewFollowups() {
  UI.fuWho = UI.fuWho || 'me'; UI.fuStatus = UI.fuStatus || 'open'; UI.fuDue = UI.fuDue || 'all';
  var q = (UI.fuQ || '').trim().toLowerCase();
  UI.fuKind = UI.fuKind || 'all';
  var list = S.followups.filter(function (f) {
    var s = studentById(f.studentId); if (!s) return false;
    if (UI.fuKind !== 'all' && (UI.fuKind === 'contact') !== (f.kind === 'contact')) return false;
    if (UI.fuStatus === 'open' && f.status === '완료') return false;
    if (UI.fuStatus === 'done' && f.status !== '완료') return false;
    if (UI.fuWho === 'me' && f.assignee !== S.me.email) return false;

    var n = dayDiff(f.due);
    if (UI.fuDue === 'over' && !(n !== null && n < 0)) return false;
    if (UI.fuDue === 'week' && !(n !== null && n <= 7)) return false;
    if (q && !fuHit(f, q)) return false;
    return true;
  }).sort(fuSort);
  UI.fuGroup = UI.fuGroup || 'due';
  // 위 버튼 줄은 결과가 0건이어도 항상 보여야 다른 필터로 돌아갈 수 있음
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">팔로업·연락 <span class="muted">' + list.length + '건</span></h2>' +

function uploadFiles(input, studentId, docId, meetingId, contractId) {
  var files = Array.prototype.slice.call(input.files);
  var cat = ($('upcat') || {}).value || '성적증명서';
  input.value = '';
  var ok = 0, chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (f.size > upMax()) { toast(f.name + ': ' + upMB() + 'MB를 넘는 파일은 올릴 수 없습니다.', true); return; }
      busy(true);
      return fetch('/api/files/upload?studentId=' + encodeURIComponent(studentId) + '&category=' + encodeURIComponent(cat) + (docId ? '&docId=' + encodeURIComponent(docId) : '') + (meetingId ? '&meetingId=' + encodeURIComponent(meetingId) : '') + (contractId ? '&contractId=' + encodeURIComponent(contractId) : ''), {
        method: 'POST', credentials: 'same-origin', body: f,
        headers: { 'X-Requested-With': 'revera', 'X-File-Name': encodeURIComponent(f.name), 'Content-Type': f.type || 'application/octet-stream' }
      }).then(handle, function () { busy(false); throw new Error('서버에 연결할 수 없습니다.'); })
        .then(function (d) { load(d); ok++; })
        .catch(function (e) { toast(f.name + ': ' + errMsg(e), true); });
    });
  });
  chain.then(function () { if (ok) toast(ok + '개 파일을 올렸습니다.' + (docId ? ' 서류가 수합 완료로 바뀌었습니다.' : '')); });
}

  var n = prompt('추가할 전형 이름 (예: 외국인 전형, 재외국민 특별전형)');
  if (!n || !n.trim()) return;
  n = n.trim().replace(/,/g, ' ');
  if (list.indexOf(n) >= 0) return toast('이미 있는 전형입니다.', true);
  UI.uniTrack = UI.uniTrack || {}; UI.uniTrack[id] = n;
  saveTracks(cy, list.concat([n]), '“' + n + '” 전형을 추가했습니다.');
}
function removeTrack(id, name) {
  var cy = findRow('unicycles', id), list = cycleTracks(cy);
  var used = S.unirounds.some(function (r) { return r.cycleId === id && r.track === name; }) || parseReqs(cy.requirements).some(function (r) { return r.track === name; });
  if (used) return toast('“' + name + '”에 입력된 요건이나 마감일이 있어 뺄 수 없습니다. 먼저 지우거나 다른 전형으로 옮기세요.', true);
  if (list.length <= 1) return toast('전형이 하나는 있어야 합니다.', true);
  if (!confirm('이 입학 연도에서 “' + name + '” 전형을 뺄까요? (예: 서울대는 3년특례 없음)')) return;
  saveTracks(cy, list.filter(function (x) { return x !== name; }), '“' + name + '” 전형을 뺐습니다.');
}
function copyCycle(id) {
  var c = findRow('unicycles', id);
  var y = prompt('새로 만들 입학 연도를 입력하세요. (요건을 복사하고 마감일은 연도만큼 옮긴 추정치로 넣습니다)', String(Number(c.year) + 1));
  if (!y) return;
  api('copyCycle', { cycleId: id, year: y.trim(), term: c.term }).then(function (d) {
    UI.uniCycle[c.universityId] = d.savedId; load(d); toast(y + '년 ' + c.term + ' 입학 초안을 만들었습니다. 공식 요강으로 확인해 주세요.');
  }).catch(function (e) { toast(errMsg(e), true); });
}

/* ============================== 통합 검색 ============================== */
function searchAll(q) {
  var toks = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  var hit = function (parts) { var t = parts.join(' ').toLowerCase(); return toks.every(function (k) { return t.indexOf(k) >= 0; }); };
  var groups = [];
  var st = S.allStudents.filter(function (s) {
    return hit([s.name, s.school, s.grade, s.curriculum, s.tracks, s.tracksNote, s.tags, s.email, s.studentPhone, s.fatherName, s.fatherPhone, s.fatherEmail,
      s.motherName, s.motherPhone, s.motherEmail, s.englishName, s.progress, s.memo, s.hopeUnis, s.focusArea, teacherName(s.counselor), teacherName(s.manager), s.status,
      childOf('schools', s.id).map(function (x) { return x.school; }).join(' '), childOf('majorplans', s.id).map(function (x) { return x.major; }).join(' ')]);
  }).map(function (s) { return { title: s.name, sub: [s.school, s.grade, s.status, ownersText(s)].filter(Boolean).join(' · '), href: '#/student/' + s.id }; });
  if (st.length) groups.push({ label: '학생', items: st });
  var un = S.universities.filter(function (u) { return hit([u.name, u.fullName, u.aliases, u.country]); })
    .map(function (u) { return { title: u.name, sub: [u.country, u.fullName].filter(Boolean).join(' · '), href: '#/uni/' + u.id }; });
  if (un.length) groups.push({ label: '대학', items: un });
  var ap = S.apps.filter(function (a) { var s = studentById(a.studentId); return s && hit([a.university, a.major, a.round, a.country, s.name]); })
    .map(function (a) { var s = studentById(a.studentId); return { title: s.name + ' — ' + a.university, sub: [a.major, a.round, a.deadline, a.status].filter(Boolean).join(' · '), href: '#/student/' + s.id, tab: 'apps' }; });
  if (ap.length) groups.push({ label: '지원대학', items: ap });
  var fu = S.followups.filter(function (f) { var s = studentById(f.studentId); return s && hit([f.topic, f.title, f.detail, f.category, s.name, teacherName(f.assignee)].concat(repliesOf(f.id).map(function (x) { return x.content; }))); })
    .map(function (f) { var s = studentById(f.studentId); return { title: s.name + ' — ' + f.title, sub: [f.status, '담당 ' + (teacherName(f.assignee) || '미정'), f.due].filter(Boolean).join(' · '), href: '#/student/' + s.id, tab: 'followups' }; });
  if (fu.length) groups.push({ label: '팔로업', items: fu });
  var dc = S.docs.filter(function (d) { var s = studentById(d.studentId); return s && hit([d.name, d.memo, s.name]); })
    .map(function (d) { var s = studentById(d.studentId); return { title: s.name + ' — ' + d.name, sub: d.status, href: '#/student/' + s.id, tab: 'docs' }; });
  if (dc.length) groups.push({ label: '서류', items: dc });
  var ai = S.appinfo.filter(function (r) { var s = studentById(r.studentId); return s && hit([r.item, appinfoText(r), s.name, r.universityId ? uniLabel(r.universityId) : '']); })
    .map(function (r) { var s = studentById(r.studentId), c = appinfoText(r); return { title: s.name + ' — ' + r.item, sub: (r.universityId ? uniLabel(r.universityId) + ' · ' : '') + (c.length > 60 ? c.slice(0, 60) + '…' : c), href: '#/student/' + s.id, tab: 'appinfo' }; });
  if (ai.length) groups.push({ label: '원서 정보', items: ai });
  var pg = (S.programs || []).filter(function (p) { return hit([p.name, p.category, p.target, p.memo]); })
    .map(function (p) { return { title: p.name, sub: [p.category, p.deadline ? '마감 ' + fmtD(p.deadline) : ''].filter(Boolean).join(' · '), href: '#/programs' }; });
  if (pg.length) groups.push({ label: '대회·프로그램', items: pg });
  var mts = S.meetings.filter(function (m) { var s = studentById(m.studentId); return s && hit([m.topic, m.content, m.parentNote, m.attendees, m.date, s.name]); })
    .map(function (m) { var s = studentById(m.studentId); return { title: s.name + ' — 미팅 ' + m.date, sub: m.topic || String(m.content || '').slice(0, 60), href: '#/student/' + s.id, tab: 'meetings' }; });
  if (mts.length) groups.push({ label: '미팅', items: mts });
  if (isMgr()) {
    var nt = S.notes.filter(function (n) { var s = studentById(n.studentId); return s && hit([n.content, n.nextAction, n.attendees, s.name]); })
      .map(function (n) { var s = studentById(n.studentId); var c = String(n.content || n.nextAction); return { title: s.name + ' — 상담기록 ' + n.date, sub: c.length > 60 ? c.slice(0, 60) + '…' : c, href: '#/student/' + s.id, tab: 'meetings' }; });
    if (nt.length) groups.push({ label: '상담기록', items: nt });
  }
  return groups;
}
function gsItem(it) {
  return '<a class="gsi" href="' + esc(it.href) + '" onclick="UI.tab=' + js(it.tab || '') + ';closeGs()"><b>' + esc(it.title) + '</b><span class="muted">' + esc(it.sub || '') + '</span></a>';
}
function gsearch() {
  var q = $('gq').value.trim(), box = $('gsr');
  if (!q) { box.style.display = 'none'; return; }
  var g = searchAll(q);
  box.innerHTML = (g.length ? g.map(function (x) {
    return '<div class="gsg">' + esc(x.label) + ' <span class="muted">' + x.items.length + '</span></div>' + x.items.slice(0, 5).map(gsItem).join('');
  }).join('') : '<div class="empty">검색 결과가 없습니다.</div>') +
    '<a class="gsall" href="#/search/' + encodeURIComponent(q) + '" onclick="closeGs()">Enter — 전체 결과 보기</a>';
  box.style.display = 'block';
}
function gsKey(e) {
  if (e.key === 'Enter') { var q = $('gq').value.trim(); if (q) { closeGs(); go('#/search/' + encodeURIComponent(q)); } }
  if (e.key === 'Escape') { closeGs(); e.stopPropagation(); }
}
function closeGs() { $('gsr').style.display = 'none'; }
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('#gs')) closeGs();
  if (!e.target.closest || !e.target.closest('.um-btn')) $('who').classList.remove('open');
});
function viewSearch(q) {
  q = decodeURIComponent(q || '');
  if ($('gq') && document.activeElement !== $('gq')) $('gq').value = q;
  var g = searchAll(q), n = g.reduce(function (a, x) { return a + x.items.length; }, 0);
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">“' + esc(q) + '” 검색 결과 <span class="muted">' + n + '건</span></h2></div>';
  h += '<div class="muted" style="margin-bottom:10px">띄어쓰기로 여러 단어를 넣으면 모두 포함된 결과만 보여줍니다. (예: “HKU 심리”)</div>';
  if (!g.length) return h + '<div class="card empty">검색 결과가 없습니다.</div>';
  return h + g.map(function (x) { return '<div class="card"><h3>' + esc(x.label) + ' <span class="muted">' + x.items.length + '건</span></h3>' + x.items.map(gsItem).join('') + '</div>'; }).join('');
}

  S.apps.forEach(function (a) { if (/^\d{4}/.test(a.deadline || '')) years[a.deadline.slice(0, 4)] = 1; });

    cs.map(function (c) {

          return '<tr><td><b>' + esc(u) + '</b></td><td>' + arr.length + '</td><td><b>' + tot(arr, '합격') + '</b></td><td>' + tot(arr, '불합격') + '</td><td>' + (tot(arr, '대기') + tot(arr, '제출완료')) + '</td>' +

/* ============================== 매출 (관리자·관리팀) ============================== */
function viewSales() {
  if (!isMgr()) return '<div class="card empty">관리자·관리팀만 볼 수 있습니다.</div>';
  var tot = {};
  CURRENCIES.forEach(function (c) { tot[c] = { paid: 0, contract: 0, due: 0 }; });
  S.contracts.forEach(function (c) {
    if (!studentById(c.studentId)) return;
    var p = contractPay(c); tot[p.cur] = tot[p.cur] || { paid: 0, contract: 0, due: 0 };
    tot[p.cur].contract += p.total; tot[p.cur].due += p.due;
  });
  var pays = S.payments.filter(function (p) { return studentById(p.studentId); });
  pays.forEach(function (p) { var c = p.currency || 'RMB'; tot[c] = tot[c] || { paid: 0, contract: 0, due: 0 }; tot[c].paid += amt(p.amount); });
  var unpaid = unpaidContracts(), rn = renewals();
  var vb = viewBranch();
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">매출 <span class="muted" style="font-size:.9rem">' + esc(vb === '전체' ? '전체 지점' : vb + ' 지점') + '</span></h2>' +
    '<span class="seg">' + BRANCHES.concat(['전체']).map(function (b) { return '<a class="' + (b === vb ? 'on' : '') + '" onclick="setBranch(' + js(b) + ')">' + esc(b === '전체' ? '전체 지점' : b) + '</a>'; }).join('') + '</span>' +
    '<span class="muted">입금일 기준 · 통화별로 따로 합산</span></div>' + salesByBranch();
  h += '<div class="grid g4" style="margin-bottom:14px">' + Object.keys(tot).filter(function (c) { return tot[c].paid || tot[c].contract; }).map(function (c) {
    return '<div class="stat"><div class="l">' + c + ' 전체 매출(입금)</div><div class="n">' + Math.round(tot[c].paid).toLocaleString('ko-KR') + '</div>' +
      '<div class="l">계약 ' + Math.round(tot[c].contract).toLocaleString('ko-KR') + ' · <span style="color:' + (tot[c].due ? 'var(--error)' : 'inherit') + '">미수금 ' + Math.round(tot[c].due).toLocaleString('ko-KR') + '</span></div></div>';
  }).join('') + '</div>';
  if (!S.contracts.length) h += '<div class="notice">아직 금액이 입력된 계약이 없습니다. 학생 → 계약 탭에서 계약 금액과 입금 기록을 넣으면 여기에 모입니다.</div>';
  h += '<div class="card">' + secHead('미수금 리마인드 <span class="muted">' + unpaid.length + '건</span>', '') +
    (unpaid.length ? '<div class="tbl-wrap">' + unpaidTable(unpaid, false) + '</div><div class="muted" style="margin-top:6px">납부 기한이 지난 건이 맨 위에 빨간색으로 표시됩니다. 기한은 계약 수정에서 “잔금 납부 기한”으로 넣을 수 있습니다.</div>'
      : '<div class="empty">미수금이 없습니다.</div>') + '</div>';
  h += '<div class="card"><h3>연간 계약 갱신 예정 <span class="muted">(두 달 안에 끝나거나 지난달 끝난 계약 중 다음 연간 계약이 없는 학생)</span></h3>' +
    (rn.length ? '<div class="tbl-wrap">' + renewalTable(rn) + '</div>' : '<div class="empty">갱신 예정인 연간 계약이 없습니다.</div>') + '</div>';
  pays.sort(function (a, b) { return (b.date + b.createdAt).localeCompare(a.date + a.createdAt); });
  h += '<div class="card"><h3>입금 내역 <span class="muted">' + pays.length + '건</span></h3>' + (pays.length ? '<div class="tbl-wrap"><table><thead><tr><th>입금일</th><th>학생</th><th>계약</th><th>금액</th><th>방법</th><th>메모</th><th>기록</th></tr></thead><tbody>' +
    pays.map(function (p) {
      var s = studentById(p.studentId);
      return '<tr class="click" onclick="openForm(\'payments\',' + js(p.id) + ')"><td class="nw">' + esc(p.date) + '</td><td class="nw"><b>' + esc(s.name) + '</b></td>' +
        '<td class="nw">' + esc(contractLabel(findRow('contracts', p.contractId))) + '</td><td class="nw"><b>' + money(amt(p.amount), p.currency) + '</b></td>' +
        '<td class="nw">' + esc(p.method) + '</td><td class="muted">' + esc(p.memo) + '</td><td class="nw muted">' + esc(teacherName(p.createdBy)) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">입금 기록이 없습니다.</div>') + '</div>';
  return h;
}

/** 지점별 합계 (입금·계약·미수금, 통화별) — 고른 지점과 상관없이 두 지점을 나란히 */
function salesByBranch() {
  var rows = BRANCHES.map(function (b) {
    var ids = {}; S.allStudents.forEach(function (s) { if (branchOf(s) === b) ids[s.id] = 1; });
    var t = {}; CURRENCIES.forEach(function (c) { t[c] = { paid: 0, contract: 0, due: 0 }; });
    S.contracts.forEach(function (c) { if (!ids[c.studentId]) return; var p = contractPay(c); t[p.cur] = t[p.cur] || { paid: 0, contract: 0, due: 0 }; t[p.cur].contract += p.total; t[p.cur].due += p.due; });
    S.payments.forEach(function (p) { if (!ids[p.studentId]) return; var c = p.currency || 'RMB'; t[c] = t[c] || { paid: 0, contract: 0, due: 0 }; t[c].paid += amt(p.amount); });
    return { b: b, n: Object.keys(ids).length, t: t };
  });
  var cur = CURRENCIES.filter(function (c) { return rows.some(function (r) { return r.t[c] && (r.t[c].paid || r.t[c].contract); }); });
  if (!cur.length) return '';
  var f = function (n) { return Math.round(n).toLocaleString('ko-KR'); };
  return '<div class="card"><h3>지점별 합계 <span class="muted">관리자·관리팀 모두 볼 수 있음</span></h3><div class="tbl-wrap"><table><thead><tr><th>지점</th><th>학생</th>' +
    cur.map(function (c) { return '<th>' + c + ' 입금</th><th>' + c + ' 계약</th><th>' + c + ' 미수금</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr class="click" onclick="setBranch(' + js(r.b) + ')"><td class="nw"><b>' + esc(r.b) + '</b></td><td class="nw">' + r.n + '명</td>' +
        cur.map(function (c) { var x = r.t[c] || { paid: 0, contract: 0, due: 0 }; return '<td class="nw"><b>' + f(x.paid) + '</b></td><td class="nw">' + f(x.contract) + '</td><td class="nw"' + (x.due ? ' style="color:var(--error)"' : '') + '>' + f(x.due) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div>';
}

/* ============================== 휴지통 ============================== */
function viewTrash() {
  if (!isMgr()) return '<div class="card empty">관리자·관리팀만 볼 수 있습니다.</div>';
  if (!UI.trash) { loadTrash(); return '<div class="card empty">불러오는 중…</div>'; }
  var items = UI.trash;
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">휴지통 <span class="muted">' + items.length + '건</span></h2><button class="btn ghost" onclick="loadTrash()">↻ 새로고침</button></div>';
  h += '<div class="notice">삭제한 학생과 기록은 여기 보관되며 <b>복구</b>할 수 있습니다. 학생을 복구하면 그 학생의 기록도 모두 함께 돌아옵니다.' +
    (isAdmin() ? ' <b>영구 삭제</b>는 되돌릴 수 없습니다.' : '') + '</div>';
  if (!items.length) return h + '<div class="card empty">휴지통이 비어 있습니다.</div>';
  UI.tsel = UI.tsel || {};
  var key = function (i) { return i.table + ':' + i.id; };
  var sel = items.filter(function (i) { return UI.tsel[key(i)]; });

function restoreBackupList() {
  if (!UI.rbList) { UI.rbList = 'loading'; fetch('/api/restore-backups', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) { UI.rbList = d.list || []; if (route().view === 'teachers') render(); }).catch(function () { UI.rbList = []; }); }

  }).join(' ') + '</div>' : '';
}
function restoreBackup(input) {
  var f = input.files[0]; input.value = '';
  if (!f) return;
  if (!/\.zip$/i.test(f.name)) return toast('Compass 백업 ZIP 파일(.zip)을 골라주세요.', true);
  if (!confirm('“' + f.name + '” (' + fmtSize(f.size) + ') 으로 복구합니다.\n\n지금 Compass의 기록 전체가 이 백업 시점으로 바뀝니다. (복구 직전 상태는 자동으로 백업해 둡니다)\n계속할까요?')) return;
  var typed = prompt('정말 복구하려면 아래 칸에 복구 라고 입력하세요.');
  if (typed === null) return;
  if (typed.trim() !== '복구') return toast('“복구”라고 입력하지 않아 취소했습니다.', true);
  busy(true); toast('복구 중입니다… 창을 닫지 마세요.');
  fetch('/api/restore', { method: 'POST', credentials: 'same-origin', body: f, headers: { 'X-Requested-With': 'revera', 'Content-Type': 'application/zip' } })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || '복구에 실패했습니다.'); return d; }); })
    .then(function (d) {
      busy(false);
      alert('복구했습니다.\n학생 ' + d.students + '명 · 파일 ' + d.filesWritten + '개 되살림\n복구 직전 상태는 “' + d.before + '”로 백업해 두었습니다.\n\n화면을 새로 불러옵니다.');
      location.reload();
    }).catch(function (e) { busy(false); toast(errMsg(e), true); });
}
function importFile(input) {
  var f = input.files[0];
  input.value = '';
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var data;
    try { data = JSON.parse(r.result); } catch (e) { return toast('JSON 파일을 읽을 수 없습니다.', true); }
    var n = (data.students || []).length;
    if (!confirm('학생 ' + n + '명의 정보를 가져옵니다. 같은 이름의 학생은 건너뜁니다. 계속할까요?')) return;
    api('importData', data).then(function (d) {
      UI.importResult = d.importResult; load(d);
      toast('가져오기 완료: ' + d.importResult.created.length + '명 등록, ' + d.importResult.skipped.length + '명 건너뜀');
    }).catch(function (e) { toast(errMsg(e), true); });
  };
  r.readAsText(f, 'utf-8');
}
