<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVERA Compass</title>
<style>
  :root { --navy:#0B1B45; --gold:#C9A227; --bg:#f4f5f8; --card:#fff; --border:#d7d9de; --muted:#6b7280;
          --error:#d9534f; --ok:#1d9e75; --warn:#d98a00; --soft:#eef0f5; }
  * { box-sizing:border-box; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:var(--bg); margin:0; color:#222; font-size:14px; }
  button, input, select, textarea { font-family:inherit; font-size:14px; }
  a { color:var(--navy); }

  header.top { background:var(--navy); color:#fff; position:sticky; top:0; z-index:20; }
  .top-in { max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand { font-weight:bold; font-size:1.05rem; white-space:nowrap; }
  .brand span { color:var(--gold); }
  nav { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
  nav a { color:#cfd6e6; text-decoration:none; padding:6px 12px; border-radius:16px; }
  nav a.on { background:var(--gold); color:var(--navy); font-weight:bold; }
  .who { font-size:.8rem; color:#cfd6e6; display:flex; align-items:center; gap:8px; }
  .who button { background:transparent; border:1px solid #5a6890; color:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; }

  main { max-width:1200px; margin:0 auto; padding:16px; }
  h2 { font-size:1.1rem; color:var(--navy); margin:4px 0 12px; }
  h3 { font-size:.95rem; color:var(--navy); margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .grid { display:grid; gap:14px; }
  .grid > * { min-width:0; }
  .nw { white-space:nowrap; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:820px) { .g2, .g4 { grid-template-columns:1fr 1fr; } .g2 { grid-template-columns:1fr; } }

  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; }
  .stat .n { font-size:1.6rem; font-weight:bold; color:var(--navy); }
  .stat .l { font-size:.8rem; color:var(--muted); }
  .stat.alert .n { color:var(--error); }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .grow { flex:1; min-width:180px; }
  input[type=text], input[type=date], input[type=email], input[type=tel], input[type=password], select, textarea {
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
  .toolbar select { width:auto; }

  .btn { padding:8px 14px; border-radius:6px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; white-space:nowrap; }
  .btn.ghost { background:#fff; color:var(--navy); }
  a.btn { display:inline-block; text-decoration:none; }
  .btn.danger { background:#fff; color:var(--error); border-color:var(--error); }
  .btn.sm { padding:4px 9px; font-size:.8rem; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--soft); vertical-align:top; }
  th { font-size:.78rem; color:var(--muted); font-weight:normal; white-space:nowrap; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:#fafbfd; }
  .tbl-wrap { overflow-x:auto; }

  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.75rem; background:var(--soft); color:#333; white-space:nowrap; }
  .pill.s-상담중 { background:#e7f0ff; color:#1d4ed8; }
  .pill.s-진행중 { background:#e6f6ef; color:#0f7a55; }
  .pill.s-보류 { background:#fff4e0; color:#a56200; }
  .pill.s-완료, .pill.s-종료 { background:#eee; color:#666; }
  .pill.a-합격 { background:#e6f6ef; color:#0f7a55; }
  .pill.a-불합격, .pill.a-철회 { background:#eee; color:#666; }
  .pill.a-제출완료 { background:#e7f0ff; color:#1d4ed8; }
  .pill.a-대기 { background:#fff4e0; color:#a56200; }
  .dday { font-weight:bold; white-space:nowrap; }
  .dday.over { color:var(--error); }
  .dday.soon { color:var(--warn); }
  .muted { color:var(--muted); font-size:.82rem; }
  .tag { display:inline-block; font-size:.72rem; background:#fffaf0; border:1px solid #f1e2b0; color:#8a6d10; border-radius:4px; padding:0 5px; margin-right:3px; }
  .empty { color:var(--muted); text-align:center; padding:18px; font-size:.85rem; }

  .tabs { display:flex; gap:4px; border-bottom:2px solid var(--soft); margin-bottom:12px; }
  .tabs a { padding:8px 14px; text-decoration:none; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; }
  .tabs a.on { color:var(--navy); border-color:var(--gold); font-weight:bold; }

  .note { border-left:3px solid var(--gold); padding:8px 12px; margin-bottom:12px; background:#fcfcfd; border-radius:0 6px 6px 0; }
  .note .meta { font-size:.78rem; color:var(--muted); margin-bottom:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .note .body { white-space:pre-wrap; line-height:1.55; }
  .note .next { margin-top:6px; font-size:.85rem; background:#fffaf0; padding:6px 8px; border-radius:4px; }
  .note .acts { margin-left:auto; display:flex; gap:4px; }

  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:.88rem; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; white-space:pre-wrap; word-break:break-all; }

  .todo { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--soft); }
  .todo input { margin-top:3px; width:16px; height:16px; }
  .todo .t { flex:1; }

  /* modal */
  .ov { position:fixed; inset:0; background:rgba(11,27,69,.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:30px 12px; overflow-y:auto; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:620px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size:1.05rem; margin-bottom:14px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .form .full { grid-column:1 / -1; }
  .form label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:3px; }
  .form label b { color:var(--error); }
  @media (max-width:560px) { .form { grid-template-columns:1fr; } }
  .modal .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .modal .foot .left { margin-right:auto; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:8px; z-index:60; display:none; max-width:90vw; font-size:.88rem; }
  #toast.err { background:var(--error); }
  #loading { position:fixed; top:0; left:0; right:0; height:3px; background:var(--gold); z-index:70; display:none; animation:ld 1s infinite linear; }
  @keyframes ld { 0% { opacity:.3 } 50% { opacity:1 } 100% { opacity:.3 } }
  #gate { min-height:80vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  #gate .card { max-width:460px; }
  .login { width:100%; max-width:380px; text-align:left; padding:28px 26px; }
  .login .logo { background:var(--navy); color:#fff; padding:12px; border-radius:40px; font-weight:bold; text-align:center; margin-bottom:20px; }
  .login .logo span { color:var(--gold); }
  .login label { display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px; }
  .login .btn { width:100%; margin-top:18px; padding:12px; font-size:1rem; }
  .login .msg { color:var(--error); font-size:.85rem; min-height:20px; margin-top:10px; }
  .tabs { overflow-x:auto; }
  .tabs a { white-space:nowrap; }
  .sec-h { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
  .sec-h h3 { margin:0; }
  .story { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .story .step { background:#fcfcfd; border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .story .step h4 { margin:0 0 6px; font-size:.82rem; color:var(--navy); }
  .story .step div { white-space:pre-wrap; font-size:.88rem; line-height:1.55; }
  @media (max-width:820px) { .story { grid-template-columns:1fr; } }
  .multi { display:flex; flex-wrap:wrap; gap:6px 14px; padding:4px 0; }
  .form .multi label { display:inline-flex; align-items:center; gap:4px; font-size:.86rem; color:#222; margin:0; }
  .role { font-size:.72rem; padding:1px 6px; border-radius:4px; background:#5a6890; color:#fff; }
  .contract { border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:10px; cursor:pointer; }
  .contract:hover { background:#fafbfd; }
  .contract .h { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .money { font-weight:bold; color:var(--navy); }
  .pill.p-납부 { background:#e6f6ef; color:#0f7a55; }
  .pill.p-미납 { background:#fdecec; color:#b42318; }
  .pill.d-수합 { background:#e6f6ef; color:#0f7a55; }
  .pill.d-해당 { background:#eee; color:#666; }
  .pill.d-요청함 { background:#fff4e0; color:#a56200; }
  .notice { background:#fffaf0; border:1px solid #f1e2b0; border-radius:8px; padding:8px 12px; font-size:.85rem; color:#6b5512; margin-bottom:12px; }
</style>
</head>
<body>
<div id="loading"></div>
<header class="top">
  <div class="top-in">
    <div class="brand">REVERA <span>Compass</span></div>
    <nav id="nav"></nav>
    <div class="who" id="who" style="display:none"><span id="whoami"></span><button onclick="refresh(true)" title="새로고침">↻ 새로고침</button><button onclick="openPasswordForm()">비밀번호 변경</button><button onclick="logout()">로그아웃</button></div>
  </div>
</header>
<main id="app"><div id="gate"><div class="card">불러오는 중…</div></div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================== 설정 ============================== */
var ROLE_LABEL = { admin: '관리자', staff: '관리팀', consultant: '컨설턴트' };
var STUDENT_STATUS = ['상담중', '진행중', '보류', '완료', '종료'];
var TRACKS = ['3년특례', '12년특례', '홍콩', '싱가폴', '미국', '캐나다', '영국', '일본', '한국 일반', '기타'];
var CONTRACT_KINDS = ['연간', '원서'];
var TIERS = ['Standard'];
var TERMS = ['', '1학기', '1년'];
var PACKAGES = ['홍콩 패키지', '싱가폴', '한국 3특', '한국 12특', '캐나다', '미국', '영국', '일본', '기타'];
var PAID = ['미납', '일부 납부', '납부 완료'];
var NOTE_TYPES = ['대면상담', '학부모상담', '전화', '위챗·문자', '수업', '기타'];
var PLACES = ['상담실', '온라인', '전화'];
var APP_ROUNDS = ['ED', 'ED2', 'EA', 'REA', 'RD', 'Rolling', 'UCAS', '홍콩 얼리', '수시', '정시', '3년특례', '12년특례', '기타'];
var APP_STATUS = ['준비중', '작성중', '제출완료', '대기', '합격', '불합격', '철회'];
var APP_FINAL = ['제출완료', '대기', '합격', '불합격', '철회'];
var ESSAY_STATUS = ['', '미착수', '브레인스토밍', '초안', '수정중', '완료'];
var GRADES = ['G9', 'G10', 'G11', 'G12', '중3', '고1', '고2', '고3', '졸업'];
var CURRICULA = ['IB', 'AP', 'A-Level', 'IGCSE', '국내 일반고', '국내 특목고', '기타'];
var SCORE_KINDS = ['SAT', 'ACT', 'TOEFL', 'IELTS', 'AP', 'IB', 'A-Level', 'GPA', 'TOPIK', 'HSK', '기타'];
var ACT_CATS = ['리서치', '서머 프로그램', '인턴십', '대회', '에세이 대회', '클럽', '봉사', '기타'];
var ACT_STATUS = ['계획', '지원 예정', '지원 완료', '진행 중', '완료', '불합격/취소'];
var ACT_DONE = ['지원 완료', '진행 중', '완료', '불합격/취소'];
var DOC_STATUS = ['요청 전', '요청함', '수합 완료', '해당 없음'];
var DOC_DONE = ['수합 완료', '해당 없음'];
var DOC_PRESETS = ['출입국사실증명서(학생)', '출입국사실증명서(부)', '출입국사실증명서(모)', '재학증명서', '성적증명서', '졸업(예정)증명서', '여권 사본', '가족관계증명서', '추천서'];
var STORY_STATUS = ['작성 전', '검토 중', '확정'];
var FILE_CATS = ['성적표', '기타'];
var CHILD = ['notes', 'contracts', 'apps', 'scores', 'activities', 'docs', 'links', 'files'];

/** 입력 양식 정의 — t: 입력 종류, o: 선택지, mgr: 관리자·관리팀만 보이는 칸, req: 필수 */
var FORMS = {
  students: { title: '학생 정보', fields: [
    { k: 'name', l: '이름', req: 1 }, { k: 'dob', l: '생년월일', t: 'date' },
    { k: 'school', l: '학교' }, { k: 'grade', l: '학년', t: 'list', o: GRADES },
    { k: 'curriculum', l: '커리큘럼', t: 'list', o: CURRICULA }, { k: 'counselor', l: '담당 컨설턴트', t: 'teacher', mgr: 1 },
    { k: 'status', l: '상태', t: 'select', o: STUDENT_STATUS }, { k: 'email', l: '학생 이메일', t: 'email' },
    { k: 'tracks', l: '트랙 (여러 개 선택 가능)', t: 'multi', o: TRACKS, full: 1 },
    { k: 'studentPhone', l: '학생 연락처' }, { k: 'parentName', l: '학부모 이름' },
    { k: 'parentPhone', l: '학부모 연락처' }, { k: 'tags', l: '태그 (쉼표로 구분)', ph: '예: 미대, 장학금' },
    { k: 'driveUrl', l: 'Google Drive 학생 폴더 링크', t: 'url', full: 1, ph: 'https://drive.google.com/drive/folders/...' },
    { k: 'memo', l: '메모', t: 'textarea', full: 1 }],
    defaults: function () { return { status: '상담중', counselor: '' }; } },
  story: { table: 'students', title: '스토리 설계', fields: [
    { k: 'storyStatus', l: '진행 상태', t: 'select', o: STORY_STATUS },
    { k: 'storyTrigger', l: '① 계기 — 관심이 어떻게 시작됐는지', t: 'textarea', full: 1 },
    { k: 'storyProcess', l: '② 탐구 과정 — 학교에서 배우지 않는 것을 스스로 탐구해 온 과정', t: 'textarea', full: 1 },
    { k: 'storyLink', l: '③ 전공·교수 연결 — 지원 대학의 어떤 전공·연구와 맞닿는지', t: 'textarea', full: 1 },
    { k: 'storyConclusion', l: '④ 결론 — 그래서 이 학교·이 전공이어야 하는 이유', t: 'textarea', full: 1 }], noDelete: 1 },
  notes: { title: '상담 기록', fields: [
    { k: 'date', l: '날짜', t: 'date', req: 1 }, { k: 'time', l: '시간', ph: '예: PM 1:00' },
    { k: 'place', l: '장소', t: 'list', o: PLACES }, { k: 'type', l: '유형', t: 'select', o: NOTE_TYPES },
    { k: 'attendees', l: '참석자', full: 1, ph: '예: 원장님, 학생, 어머님, 담당 선생님' },
    { k: 'content', l: '미팅 내용', t: 'textarea', full: 1, big: 1 },
    { k: 'nextAction', l: '다음 할 일', ph: '예: 레쥬메 수정본 받기' }, { k: 'nextDue', l: '할 일 기한', t: 'date' },
    { k: 'done', l: '할 일 완료', t: 'check', editOnly: 1 }],
    defaults: function () { return { date: today(), type: '대면상담', place: '상담실' }; } },
  contracts: { title: '계약', fields: [
    { k: 'kind', l: '종류', t: 'select', o: CONTRACT_KINDS, req: 1 }, { k: 'tier', l: '등급', t: 'select', o: TIERS },
    { k: 'term', l: '기간 (연간 컨설팅)', t: 'select', o: TERMS }, { k: 'startMonth', l: '시작 연월', t: 'month' },
    { k: 'packages', l: '포함 국가·패키지 (원서 컨설팅)', t: 'multi', o: PACKAGES, full: 1 },
    { k: 'signedDate', l: '계약일', t: 'date' }, { k: 'paid', l: '납부 상태', t: 'select', o: PAID, mgr: 1 },
    { k: 'amount', l: '계약 금액 (RMB)', mgr: 1, ph: '예: 30000' },
    { k: 'scope', l: '포함 범위 / 특약사항', t: 'textarea', full: 1, ph: '예: HKU+SMU+캐나다 3개 대학. 미국 에세이는 미포함(별도 계약)' },
    { k: 'memo', l: '메모', t: 'textarea', full: 1 }],
    defaults: function () { return { kind: '원서', tier: 'Standard', startMonth: today().slice(0, 7), paid: '미납' }; } },
  apps: { title: '지원 대학', fields: [
    { k: 'university', l: '대학', req: 1 }, { k: 'major', l: '전공' },
    { k: 'round', l: '전형', t: 'list', o: APP_ROUNDS }, { k: 'deadline', l: '마감일', t: 'date' },
    { k: 'status', l: '진행 상태', t: 'select', o: APP_STATUS }, { k: 'essay', l: '에세이', t: 'select', o: ESSAY_STATUS },
    { k: 'memo', l: '메모 (추천서·장학금 등)', t: 'textarea', full: 1 }],
    defaults: function () { return { status: '준비중' }; } },
  scores: { title: '성적', fields: [
    { k: 'kind', l: '시험·성적 종류', t: 'select', o: SCORE_KINDS, req: 1 },
    { k: 'subject', l: '과목 / 구분', ph: '예: Calculus BC, Biology HL, 누적 GPA' },
    { k: 'score', l: '점수', ph: '예: 1450 / 5 / 7 / 3.85' },
    { k: 'detail', l: '세부 점수', ph: '예: RW 700 · Math 750' },
    { k: 'date', l: '응시일 / 기준일', t: 'date' }, { k: 'memo', l: '메모', ph: '예: 목표 1500, 재응시 예정' }],
    defaults: function () { return { kind: 'SAT' }; } },
  activities: { title: '활동·대회', fields: [
    { k: 'category', l: '분류', t: 'select', o: ACT_CATS }, { k: 'name', l: '활동 이름', req: 1 },

/* ============================== 상태 ============================== */
var S = { me: null, teachers: [], students: [], loadedAt: 0 };
CHILD.forEach(function (t) { S[t] = []; });
var UI = { q: '', status: 'active', counselor: 'all', track: '', tab: '', dlRange: '60', dlHideDone: true,

function isMgr() { return S.me && (S.me.role === 'admin' || S.me.role === 'staff'); }

/* ============================== 서버 호출 ============================== */
function post(url, body) {
  busy(true);
  return fetch(url, { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'revera' }, body: JSON.stringify(body || {}) })
    .then(function (res) { return handle(res); }, function () { busy(false); throw new Error('서버에 연결할 수 없습니다. 인터넷(VPN) 연결을 확인하세요.'); });
}
function handle(res) {
  return res.json().catch(function () { return {}; }).then(function (data) {
    busy(false);
    if (res.ok) return data;
    if (data.needLogin) showLogin();
    var e = new Error(data.error || ('서버 오류 (' + res.status + ')')); e.needLogin = !!data.needLogin; throw e;
  });
}
function api(fn, arg) { return post('/api/rpc/' + fn, { arg: arg }); }
var busyCount = 0;
function busy(on) { busyCount = Math.max(0, busyCount + (on ? 1 : -1)); $('loading').style.display = busyCount > 0 ? 'block' : 'none'; }
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }

function load(data) {
  S.me = data.me; S.teachers = data.teachers; S.students = data.students; S.loadedAt = Date.now();
  CHILD.forEach(function (t) { S[t] = data[t] || []; });
  $('whoami').innerHTML = esc(S.me.name) + ' <span class="role">' + esc(ROLE_LABEL[S.me.role] || S.me.role) + '</span>';
  $('who').style.display = 'flex';
  render();
  if (S.me.mustChangePassword) openPasswordForm(true);
}
function refresh(manual) {
  return api('getAll').then(function (d) { load(d); if (manual) toast('최신 데이터로 새로고침했습니다.'); })
    .catch(function (e) {
      if (e.needLogin) return;
      if (!S.me) $('app').innerHTML = '<div id="gate"><div class="card"><h3>접속할 수 없습니다</h3><p>' + esc(errMsg(e)) + '</p></div></div>';
      else toast(errMsg(e), true);
    });
}
/** 저장 계열 호출: 성공 시 전체 데이터 갱신 후 응답을 돌려줌(실패 시 null) */
function mutate(fn, arg, okMsg) {
  return api(fn, arg).then(function (d) { load(d); closeModal(true); if (okMsg) toast(okMsg); return d; })
    .catch(function (e) { toast(errMsg(e), true); return null; });
}

/* ============================== 유틸 ============================== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
/** onclick 속성 안에 넣을 JS 값 */
function js(v) { return esc(JSON.stringify(v)); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayDiff(dateStr) {
  if (!/^\d{4}-\d{2}-\d{2}/.test(dateStr || '')) return null;
  var a = new Date(dateStr.slice(0, 10) + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function dday(dateStr) {
  var n = dayDiff(dateStr);
  if (n === null) return '';
  var cls = n < 0 ? 'over' : n <= 7 ? 'soon' : '';
  var txt = n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n);
  return '<span class="dday ' + cls + '">' + txt + '</span>';
}
function fmtTime(s) { return s ? s.slice(0, 16).replace('T', ' ') : ''; }
function fmtSize(n) { n = Number(n) || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
function fmtMoney(v) { var n = Number(String(v).replace(/[^\d.]/g, '')); return v && !isNaN(n) && /\d/.test(v) ? n.toLocaleString('ko-KR') : esc(v); }
function teacherName(email) {
  if (!email) return '';
  var t = S.teachers.filter(function (x) { return x.email.toLowerCase() === String(email).toLowerCase(); })[0];
  return t ? t.name : String(email).split('@')[0];
}
function studentById(id) { return S.students.filter(function (s) { return s.id === id; })[0]; }
function findRow(table, id) { return (table === 'students' ? S.students : S[table]).filter(function (x) { return x.id === id; })[0]; }
function childOf(table, sid) { return S[table].filter(function (x) { return x.studentId === sid; }); }
function notesOf(id) { return childOf('notes', id).sort(function (a, b) { return (b.date + b.createdAt).localeCompare(a.date + a.createdAt); }); }
function byDate(k) { return function (a, b) { return (a[k] || '9999').localeCompare(b[k] || '9999'); }; }
function isActive(s) { return s.status !== '완료' && s.status !== '종료'; }
function isMine(s) { return String(s.counselor).toLowerCase() === S.me.email; }
function tags(s) { return String(s || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean); }
function tagHtml(list, cls) { return list.map(function (t) { return '<span class="tag' + (cls ? ' ' + cls : '') + '">' + esc(t) + '</span>'; }).join(''); }
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
function opts(list, cur) { return list.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + ' value="' + esc(v) + '">' + esc(v || '—') + '</option>'; }).join(''); }
function teacherOpts(cur) {
  var act = S.teachers.filter(function (t) { return t.active || t.email === cur; });
  return '<option value="">미지정</option>' + act.map(function (t) {
    return '<option value="' + esc(t.email) + '"' + (t.email === cur ? ' selected' : '') + '>' + esc(t.name) + ' (' + esc(ROLE_LABEL[t.role] || t.role) + ')</option>';

function programSummary(sid) {

  }).join(' + ');
}
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 2500);
}
function formData(form) {
  var o = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name) return;
    if (el.type === 'checkbox' && el.getAttribute('data-multi')) {
      o[el.name] = o[el.name] || [];
      if (el.checked) o[el.name].push(el.value);
    } else {
      o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
    }
  });
  return o;
}

/** 마감이 있는 항목(지원대학·활동·서류)을 한 목록으로 */
function deadlineItems(includeDone) {
  var out = [];
  S.apps.forEach(function (a) {
    out.push({ table: 'apps', id: a.id, studentId: a.studentId, kind: '지원대학', title: a.university,
      sub: [a.major, a.round].filter(Boolean).join(' · '), date: a.deadline, status: a.status, done: APP_FINAL.indexOf(a.status) >= 0 });
  });
  S.activities.forEach(function (x) {
    out.push({ table: 'activities', id: x.id, studentId: x.studentId, kind: '활동', title: x.name,
      sub: x.category, date: x.deadline, status: x.status, done: ACT_DONE.indexOf(x.status) >= 0 });
  });
  S.docs.forEach(function (d) {
    out.push({ table: 'docs', id: d.id, studentId: d.studentId, kind: '서류', title: d.name,
      sub: d.memo, date: d.due, status: d.status, done: DOC_DONE.indexOf(d.status) >= 0 });

  return out.filter(function (i) { return dayDiff(i.date) !== null && studentById(i.studentId) && (includeDone || !i.done); })
    .sort(byDate('date'));
}
function pendingTodos() {
  return S.notes.filter(function (n) { return n.nextAction && n.done !== 'TRUE' && studentById(n.studentId); })
    .sort(byDate('nextDue'));
}

/* ============================== 라우팅 ============================== */

/* ============================== 대시보드 ============================== */
function viewDashboard() {
  var active = S.students.filter(isActive);
  var mine = active.filter(isMine);
  var dl = deadlineItems(false);
  var soon = dl.filter(function (i) { return dayDiff(i.date) <= 14; });
  var docsPending = S.docs.filter(function (d) { return DOC_DONE.indexOf(d.status) < 0 && studentById(d.studentId); });
  var h = '<div class="grid g4" style="margin-bottom:14px">';
  if (isMgr()) {
    var todos = pendingTodos();
    var overdue = todos.filter(function (n) { return dayDiff(n.nextDue) !== null && dayDiff(n.nextDue) < 0; });
    h += stat(active.length, '진행 중인 학생', "UI.counselor='all';UI.status='active';go('#/students')") +
      stat(soon.length, '14일 내 마감', "go('#/deadlines')", soon.some(function (i) { return dayDiff(i.date) <= 3; })) +
      stat(todos.length + (overdue.length ? ' / ' + overdue.length : ''), '남은 할 일' + (overdue.length ? ' / 기한 지남' : ''), '', overdue.length > 0) +
      stat(docsPending.length, '수합 안 된 서류', '');
  } else {
    h += stat(active.length, '담당 학생 (진행 중)', "UI.status='active';go('#/students')") +
      stat(soon.length, '14일 내 마감', "go('#/deadlines')", soon.some(function (i) { return dayDiff(i.date) <= 3; })) +
      stat(docsPending.length, '수합 안 된 서류', '') +
      stat(S.students.filter(function (s) { return isActive(s) && s.storyStatus !== '확정'; }).length, '스토리 미확정', '');
  }
  h += '</div><div class="grid g2"><div>';
  h += '<div class="card"><h3>다가오는 마감 (30일)</h3><div class="tbl-wrap">' + deadlineTable(dl.filter(function (i) { return dayDiff(i.date) <= 30; }), '30일 안에 마감되는 항목이 없습니다.') + '</div></div>';
  h += '</div><div>';
  if (isMgr()) {
    var recent = S.notes.filter(function (n) { return studentById(n.studentId); })
      .sort(function (a, b) { return (b.date + b.createdAt).localeCompare(a.date + a.createdAt); }).slice(0, 6);
    h += '<div class="card"><h3>할 일 (상담기록의 “다음 할 일”)</h3>' + todoList(pendingTodos()) + '</div>';
    h += '<div class="card"><h3>최근 상담 기록</h3>' + (recent.length ? recent.map(function (n) {
      var s = studentById(n.studentId);
      return '<div class="todo" style="cursor:pointer" onclick="openStudent(' + js(s.id) + ',\'notes\')"><div class="t"><b>' + esc(s.name) + '</b> <span class="muted">' + esc(n.date) + ' · ' + esc(n.type) + ' · ' + esc(teacherName(n.author || n.createdBy)) + '</span><div class="muted" style="margin-top:2px">' + esc(String(n.content).slice(0, 80)) + (String(n.content).length > 80 ? '…' : '') + '</div></div></div>';
    }).join('') : '<div class="empty">아직 상담 기록이 없습니다.</div>') + '</div>';
  } else {
    h += '<div class="card"><h3>담당 학생</h3>' + (mine.length ? mine.map(function (s) {

  }

function stat(n, label, onclick, alert) {

/* ============================== 학생 목록 ============================== */
function filteredStudents() {
  var q = UI.q.toLowerCase();
  return S.students.filter(function (s) {
    if (UI.status === 'active' && !isActive(s)) return false;
    if (UI.status !== 'active' && UI.status !== 'all' && s.status !== UI.status) return false;
    if (isMgr()) {
      if (UI.counselor === 'me' && !isMine(s)) return false;
      if (UI.counselor === 'none' && s.counselor) return false;
      if (UI.counselor.indexOf('@') > 0 && String(s.counselor).toLowerCase() !== UI.counselor.toLowerCase()) return false;
    }
    if (UI.track && tags(s.tracks).indexOf(UI.track) < 0) return false;
    if (q && [s.name, s.school, s.tags, s.tracks, s.curriculum, s.grade, s.parentName].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
}
function viewStudents() {
  var list = filteredStudents();

function uploadFiles(input, studentId) {
  var files = Array.prototype.slice.call(input.files);
  var cat = ($('upcat') || {}).value || '성적표';
  input.value = '';
  var ok = 0, chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (f.size > 20 * 1024 * 1024) { toast(f.name + ': 20MB를 넘는 파일은 올릴 수 없습니다.', true); return; }
      busy(true);
      return fetch('/api/files/upload?studentId=' + encodeURIComponent(studentId) + '&category=' + encodeURIComponent(cat), {
        method: 'POST', credentials: 'same-origin', body: f,
        headers: { 'X-Requested-With': 'revera', 'X-File-Name': encodeURIComponent(f.name), 'Content-Type': f.type || 'application/octet-stream' }
      }).then(handle, function () { busy(false); throw new Error('서버에 연결할 수 없습니다.'); })
        .then(function (d) { load(d); ok++; })
        .catch(function (e) { toast(f.name + ': ' + errMsg(e), true); });
    });
  });
  chain.then(function () { if (ok) toast(ok + '개 파일을 올렸습니다.'); });
}

}
function kv(k, v) { return '<dt>' + esc(k) + '</dt><dd>' + (v ? esc(v) : '<span class="muted">-</span>') + '</dd>'; }

/* ============================== 마감일정 ============================== */
function viewDeadlines() {
  var range = UI.dlRange === 'all' ? null : Number(UI.dlRange);
  var list = deadlineItems(!UI.dlHideDone).filter(function (i) {
    if (range !== null && dayDiff(i.date) > range) return false;
    if (isMgr() && UI.counselor === 'me' && !isMine(studentById(i.studentId))) return false;
    return true;
  });
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">마감일정 <span class="muted">' + list.length + '건</span></h2>' +
    '<select onchange="UI.dlRange=this.value;render()">' + [['14', '14일 이내'], ['30', '30일 이내'], ['60', '60일 이내'], ['all', '전체']].map(function (o) {
      return '<option value="' + o[0] + '"' + (UI.dlRange === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select>' +
    (isMgr() ? '<select onchange="UI.counselor=this.value;render()"><option value="all">모든 담당자</option><option value="me"' + (UI.counselor === 'me' ? ' selected' : '') + '>내 담당 학생만</option></select>' : '') +
    '<label class="muted"><input type="checkbox"' + (UI.dlHideDone ? ' checked' : '') + ' onchange="UI.dlHideDone=this.checked;render()"> 끝난 항목 숨기기</label></div>';
  return h + '<div class="card tbl-wrap">' + deadlineTable(list, '해당하는 항목이 없습니다. (지원대학·활동·서류 중 마감일이 있는 것만 표시됩니다)') + '</div>';
}

/* ============================== 휴지통 ============================== */
function viewTrash() {
  if (!isMgr()) return '<div class="card empty">관리자·관리팀만 볼 수 있습니다.</div>';
  if (!UI.trash) { loadTrash(); return '<div class="card empty">불러오는 중…</div>'; }
  var items = UI.trash;
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">휴지통 <span class="muted">' + items.length + '건</span></h2><button class="btn ghost" onclick="loadTrash()">↻ 새로고침</button></div>';
  h += '<div class="notice">삭제한 학생과 기록은 여기 보관되며 <b>복구</b>할 수 있습니다. 학생을 복구하면 그 학생의 기록도 모두 함께 돌아옵니다.' +
    (isAdmin() ? ' <b>영구 삭제</b>는 되돌릴 수 없습니다.' : '') + '</div>';
  if (!items.length) return h + '<div class="card empty">휴지통이 비어 있습니다.</div>';
  return h + '<div class="card tbl-wrap"><table><thead><tr><th>삭제 시각</th><th>종류</th><th>학생</th><th>내용</th><th>삭제한 사람</th><th></th></tr></thead><tbody>' +
    items.map(function (i) {
      return '<tr><td class="nw">' + esc(fmtTime(i.deletedAt)) + '</td><td class="nw">' + esc(i.label) + '</td><td class="nw"><b>' + esc(i.studentName) + '</b>' +
        (i.studentDeleted ? '<div class="muted">학생도 휴지통에 있음</div>' : '') + '</td><td>' + esc(i.summary) + '</td><td class="nw">' + esc(teacherName(i.deletedBy)) + '</td>' +
        '<td class="nw">' + (i.studentDeleted ? '' : '<button class="btn sm" onclick="restoreItem(' + js(i.table) + ',' + js(i.id) + ')">복구</button> ') +
        (isAdmin() ? '<button class="btn danger sm" onclick="purgeItem(' + js(i.table) + ',' + js(i.id) + ',' + js(i.studentName + ' ' + i.summary) + ')">영구 삭제</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function loadTrash() {
  return api('getTrash').then(function (d) { UI.trash = d.items; if (route().view === 'trash') render(); })
    .catch(function (e) { toast(errMsg(e), true); });
}
function restoreItem(table, id) {
  mutate('restore', { table: table, id: id }, '복구했습니다.').then(function (d) { if (d) loadTrash(); });
}
function purgeItem(table, id, label) {
  if (!confirm('"' + label + '"을(를) 영구 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?')) return;
  api('purge', { table: table, id: id }).then(function (d) { UI.trash = d.items; toast('영구 삭제했습니다.'); render(); })
    .catch(function (e) { toast(errMsg(e), true); });
}

/* ============================== 변경 기록 (관리자) ============================== */
var ACTION_LABEL = { create: '등록', update: '수정', 'delete': '삭제(휴지통)', restore: '복구', purge: '영구 삭제', upload: '파일 업로드',
  login: '로그인', 'change-password': '비밀번호 변경', 'create-admin': '관리자 생성', 'reset-admin': '관리자 재설정' };
function viewLog() {
  if (!isAdmin()) return '<div class="card empty">관리자만 볼 수 있습니다.</div>';
  if (!UI.log) { loadLog(); return '<div class="card empty">불러오는 중…</div>'; }
  var q = UI.logQ.toLowerCase();
  var rows = UI.log.filter(function (r) {
    if (!UI.logLogin && r.action === 'login') return false;
    if (UI.logWho && r.email !== UI.logWho) return false;
    if (UI.logTbl && r.tblLabel !== UI.logTbl) return false;
    if (UI.logAct && r.action !== UI.logAct) return false;
    if (q && (r.summary + ' ' + teacherName(r.email)).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var who = {}, tbls = {};
  UI.log.forEach(function (r) { who[r.email] = 1; tbls[r.tblLabel] = 1; });
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">변경 기록 <span class="muted">' + rows.length + '건</span></h2><button class="btn ghost" onclick="loadLog()">↻ 새로고침</button></div>';
  h += '<div class="toolbar"><input type="text" id="q" class="grow" placeholder="내용·학생 이름 검색" value="' + esc(UI.logQ) + '" oninput="UI.logQ=this.value;UI._focusQ=true;render()">' +
    '<select onchange="UI.logWho=this.value;render()"><option value="">모든 사람</option>' + Object.keys(who).map(function (e) {
      return '<option value="' + esc(e) + '"' + (UI.logWho === e ? ' selected' : '') + '>' + esc(teacherName(e)) + '</option>'; }).join('') + '</select>' +
    '<select onchange="UI.logTbl=this.value;render()"><option value="">모든 종류</option>' + opts(Object.keys(tbls), UI.logTbl) + '</select>' +
    '<select onchange="UI.logAct=this.value;render()"><option value="">모든 동작</option>' + Object.keys(ACTION_LABEL).map(function (a) {
      return '<option value="' + a + '"' + (UI.logAct === a ? ' selected' : '') + '>' + ACTION_LABEL[a] + '</option>'; }).join('') + '</select>' +
    '<label class="muted"><input type="checkbox"' + (UI.logLogin ? ' checked' : '') + ' onchange="UI.logLogin=this.checked;render()"> 로그인 기록 포함</label></div>';
  if (!rows.length) return h + '<div class="card empty">조건에 맞는 기록이 없습니다.</div>';
  return h + '<div class="card tbl-wrap"><table><thead><tr><th>시각</th><th>사람</th><th>동작</th><th>종류</th><th>내용</th></tr></thead><tbody>' +
    rows.slice(0, 500).map(function (r) {
      return '<tr><td class="nw">' + esc(fmtTime(r.at)) + '</td><td class="nw">' + esc(teacherName(r.email)) + '</td>' +
        '<td class="nw"><span class="pill">' + esc(ACTION_LABEL[r.action] || r.action) + '</span></td><td class="nw">' + esc(r.tblLabel) + '</td><td>' + esc(r.summary) + '</td></tr>';
    }).join('') + '</tbody></table>' + (rows.length > 500 ? '<div class="muted" style="margin-top:8px">최근 500건만 표시합니다. 검색으로 범위를 좁혀보세요.</div>' : '') + '</div>';
}
function loadLog() {
  return api('getLog', { limit: 3000 }).then(function (d) { UI.log = d.rows; if (route().view === 'log') render(); })
    .catch(function (e) { toast(errMsg(e), true); });
}

/* ============================== 계정 관리 (관리자) ============================== */
function viewTeachers() {
  if (!isAdmin()) return '<div class="card empty">관리자만 볼 수 있습니다.</div>';
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">계정 관리</h2><button class="btn" onclick="openTeacherForm()">+ 계정 추가</button></div>';
  h += '<div class="card muted" style="line-height:1.7"><b>관리자</b>: 모든 기능 + 계정 관리·변경 기록·영구 삭제 · ' +
    '<b>관리팀</b>: 모든 학생, 상담기록, 계약 금액, 삭제·복구 · ' +
    '<b>컨설턴트</b>: 담당 학생만 (상담기록·계약 금액은 볼 수 없음)<br>' +
    '계정을 추가할 때 <b>임시 비밀번호</b>를 정해서 직접 전달하세요. 처음 로그인하면 본인 비밀번호로 바꾸도록 안내됩니다. 퇴사자는 “비활성”으로 바꾸면 즉시 로그아웃됩니다.</div>';
  h += '<div class="card"><h3>데이터 백업</h3><div class="muted" style="margin-bottom:10px">학생·기록 데이터 전체를 파일 하나(.db)로 내려받습니다. 정기적으로(예: 주 1회) 받아서 안전한 곳에 보관하세요. (업로드한 성적표 파일은 포함되지 않습니다)</div>' +
    '<a class="btn ghost" href="/api/backup" download>백업 파일 다운로드</a></div>';
  h += '<div class="card tbl-wrap"><table><thead><tr><th>이름</th><th>이메일</th><th>역할</th><th>상태</th><th>담당 학생</th><th></th></tr></thead><tbody>' +
    S.teachers.map(function (t) {
      var cnt = S.students.filter(function (s) { return isActive(s) && String(s.counselor).toLowerCase() === t.email.toLowerCase(); }).length;
      return '<tr><td><b>' + esc(t.name) + '</b></td><td>' + esc(t.email) + '</td><td>' + esc(ROLE_LABEL[t.role] || t.role) + '</td>' +
        '<td>' + (t.active ? '<span class="pill s-진행중">활성</span>' : '<span class="pill s-종료">비활성</span>') + '</td><td>' + cnt + '명</td>' +
        '<td><button class="btn ghost sm" onclick="openTeacherForm(' + js(t.email) + ')">수정</button></td></tr>';
    }).join('') + '</tbody></table></div>';
  return h;
}
function openTeacherForm(email) {
  var t = email ? S.teachers.filter(function (x) { return x.email === email; })[0] : { role: 'consultant', active: true };
  var body = fld('이메일 (로그인 아이디)', inp('email', t.email, 'email', email ? ' readonly' : ' required'), false, true) + fld('이름', inp('name', t.name)) +
    fld('역할', '<select name="role">' + ['consultant', 'staff', 'admin'].map(function (r) {
      return '<option value="' + r + '"' + (t.role === r ? ' selected' : '') + '>' + ROLE_LABEL[r] + '</option>'; }).join('') + '</select>') +
    fld('상태', '<select name="active"><option value="1"' + (t.active ? ' selected' : '') + '>활성</option><option value="0"' + (!t.active ? ' selected' : '') + '>비활성</option></select>') +
    fld(email ? '비밀번호 초기화 (바꿀 때만 입력)' : '임시 비밀번호 (8자 이상)', inp('password', '', 'text', ' autocomplete="off"' + (email ? ' placeholder="비워두면 그대로"' : ' required')), true, !email);
  modal(email ? '계정 수정' : '계정 추가', body,
    '<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitTeacher()">저장</button>');
}
function submitTeacher() {
  var o = formData($('mf'));
  o.active = o.active === '1';
  if (o.password && o.password.length < 8) return toast('비밀번호는 8자 이상이어야 합니다.', true);
  mutate('saveTeacher', o, o.password ? '저장했습니다. 임시 비밀번호를 전달하세요.' : '저장했습니다.');
}

/* ============================== 공통 입력 양식 ============================== */
var modalLocked = false;
function modal(title, body, foot, locked) {
  modalLocked = !!locked;
  $('modal').innerHTML = '<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>' + esc(title) + '</h3><form id="mf" class="form" onsubmit="return false">' + body + '</form><div class="foot">' + foot + '</div></div></div>';
  var first = $('mf').querySelector('input:not([type=hidden]):not([type=checkbox]),textarea,select'); if (first) first.focus();
}
function closeModal(force) { if (modalLocked && force !== true && S.me && S.me.mustChangePassword) return; modalLocked = false; $('modal').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
function fld(label, html, full, req) { return '<div class="' + (full ? 'full' : '') + '"><label>' + esc(label) + (req ? ' <b>*</b>' : '') + '</label>' + html + '</div>'; }
function inp(name, val, type, extra) { return '<input type="' + (type || 'text') + '" name="' + name + '" value="' + esc(val) + '"' + (extra || '') + '>'; }
function sel(name, list, val) { return '<select name="' + name + '">' + opts(list.indexOf(val) < 0 && val ? list.concat([val]) : list, val) + '</select>'; }
function datalist(id, list) { return '<datalist id="' + id + '">' + list.map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>'; }
function hidden(name, val) { return '<input type="hidden" name="' + name + '" value="' + esc(val) + '">'; }

function field(f, rec) {
  var v = rec[f.k] == null ? '' : rec[f.k], h;
  var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : '';
  if (f.t === 'textarea') h = '<textarea name="' + f.k + '"' + ph + (f.big ? ' style="min-height:180px"' : '') + '>' + esc(v) + '</textarea>';
  else if (f.t === 'select') h = sel(f.k, f.o, v);
  else if (f.t === 'list') h = inp(f.k, v, 'text', ' list="dl-' + f.k + '"' + ph) + datalist('dl-' + f.k, f.o);
  else if (f.t === 'teacher') h = '<select name="' + f.k + '">' + teacherOpts(v) + '</select>';
  else if (f.t === 'check') h = '<div><label style="display:inline-flex;gap:6px;align-items:center;color:#222"><input type="checkbox" name="' + f.k + '"' + (v === 'TRUE' ? ' checked' : '') + '> 완료</label></div>';
  else if (f.t === 'multi') {
    var cur = tags(v);
    h = '<div class="multi">' + f.o.concat(cur.filter(function (x) { return f.o.indexOf(x) < 0; })).map(function (o) {
      return '<label><input type="checkbox" data-multi="1" name="' + f.k + '" value="' + esc(o) + '"' + (cur.indexOf(o) >= 0 ? ' checked' : '') + '> ' + esc(o) + '</label>';
    }).join('') + '</div>';
  } else h = inp(f.k, v, f.t === 'url' ? 'text' : (f.t || 'text'), ph);
  return fld(f.l, h, f.full || f.t === 'multi', f.req);
}

function openForm(key, id, studentId) {
  var F = FORMS[key], table = F.table || key;
  var rec = id ? findRow(table, id) : Object.assign({ studentId: studentId }, F.defaults ? F.defaults() : {});
  if (id && !rec) return toast('항목을 찾을 수 없습니다. 새로고침 해주세요.', true);
  if (MGR_ONLY_FORMS.indexOf(key) >= 0 && !isMgr()) return toast('관리자·관리팀만 수정할 수 있습니다.', true);
  var body = (id ? hidden('id', rec.id) + hidden('updatedAt', rec.updatedAt) : '') + (table !== 'students' ? hidden('studentId', rec.studentId) : '');
  body += F.fields.filter(function (f) { return !(f.mgr && !isMgr()) && !(f.editOnly && !(id && rec.nextAction)); })
    .map(function (f) { return field(f, rec); }).join('');
  if (id && table !== 'students') body += '<div class="full muted">마지막 수정: ' + esc(fmtTime(rec.updatedAt)) + ' · ' + esc(teacherName(rec.updatedBy)) + '</div>';
  var st = table === 'students' ? (id ? rec : null) : studentById(rec.studentId);
  var canDel = id && !F.noDelete && table !== 'students';
  var foot = (canDel ? '<button class="btn danger left" onclick="delItem(' + js(table) + ',' + js(id) + ')">삭제</button>' : '') +
    '<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitForm(' + js(key) + ')">저장</button>';
  modal((id ? F.title + ' 수정' : F.title + ' 추가') + (st ? ' — ' + st.name : ''), body, foot);
}
var MGR_ONLY_FORMS = ['notes', 'contracts'];
function submitForm(key) {
  var F = FORMS[key], table = F.table || key;
  var o = formData($('mf'));
  var miss = F.fields.filter(function (f) { return f.req && !(f.mgr && !isMgr()) && !String(o[f.k] || '').trim(); })[0];
  if (miss) return toast(miss.l + ' 항목을 입력하세요.', true);
  if (table === 'notes' && !o.content && !o.nextAction) return toast('미팅 내용 또는 다음 할 일을 입력하세요.', true);
  mutate('save', { table: table, obj: o }, '저장했습니다.').then(function (d) {
    if (d && table === 'students' && !o.id && d.savedId) openStudent(d.savedId);
  });
}
function delItem(table, id) {
  var label = table === 'students' ? '이 학생과 학생의 모든 기록을' : '이 항목을';
  if (!confirm(label + ' 휴지통으로 옮깁니다.\n관리자·관리팀이 휴지통에서 복구할 수 있습니다. 계속할까요?')) return;
  UI.trash = null;
  mutate('remove', { table: table, id: id }, '휴지통으로 옮겼습니다.').then(function (d) { if (d && table === 'students') go('#/students'); });
}

/* ============================== 시작 ============================== */
refresh();
// 다른 선생님의 변경사항 반영: 창이 보이고 입력 중이 아닐 때 2분마다 자동 새로고침
setInterval(function () {
  if (S.me && document.visibilityState === 'visible' && !$('modal').innerHTML && document.activeElement.id !== 'q') refresh();
}, 120000);
</script>
</body>
</html>
