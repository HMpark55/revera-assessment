<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">

<title>REVERA Compass</title>
<style>
  :root { --navy:#0B1B45; --gold:#C9A227; --bg:#f4f5f8; --card:#fff; --border:#d7d9de; --muted:#6b7280;
          --error:#d9534f; --ok:#1d9e75; --warn:#d98a00; --soft:#eef0f5; }
  * { box-sizing:border-box; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:var(--bg); margin:0; color:#222; font-size:14px; }
  button, input, select, textarea { font-family:inherit; font-size:14px; }
  a { color:var(--navy); }

  header.top { background:var(--navy); color:#fff; position:sticky; top:0; z-index:20; }
  .top-in { max-width:1200px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { font-weight:bold; font-size:1.05rem; white-space:nowrap; }
  .brand span { color:var(--gold); }
  #nav { background:#fff; color:#333; border-bottom:1px solid var(--border); }
  #nav:empty { display:none; }
  .navrow-o + .navrow-o { border-top:1px solid var(--soft); }
  .navrow { max-width:1200px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .navrow .nl { font-size:.72rem; color:var(--muted); width:40px; flex-shrink:0; }
  .navrow a { color:#4a5468; text-decoration:none; padding:9px 12px 7px; white-space:nowrap; border-bottom:3px solid transparent; font-size:.9rem; }
  .navrow a:hover { color:var(--navy); }
  .navrow a.on { color:var(--navy); font-weight:bold; border-bottom-color:var(--gold); }
  .um { position:relative; font-size:.85rem; }
  .um-btn { background:transparent; border:1px solid #5a6890; color:#fff; border-radius:18px; padding:4px 10px 4px 4px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .av { width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--navy); font-weight:bold; display:inline-flex; align-items:center; justify-content:center; font-size:.78rem; }
  .um-menu { display:none; position:absolute; right:0; top:100%; padding-top:6px; z-index:45; }
  .um:hover .um-menu, .um.open .um-menu { display:block; }
  .um-box { background:#fff; color:#222; border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); min-width:200px; overflow:hidden; }
  .um-h { padding:10px 14px; border-bottom:1px solid var(--soft); font-size:.8rem; color:var(--muted); }
  .um-h b { color:#222; font-size:.9rem; }
  .um-box a { display:block; padding:9px 14px; color:#333; text-decoration:none; cursor:pointer; letter-spacing:.02em; }
  .um-box a + a { border-top:1px solid var(--soft); }
  .um-box a:hover { background:#f4f6fa; }

  main { max-width:1200px; margin:0 auto; padding:16px; }
  h2 { font-size:1.1rem; color:var(--navy); margin:4px 0 12px; }
  h3 { font-size:.95rem; color:var(--navy); margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .grid { display:grid; gap:14px; }
  .grid > * { min-width:0; }
  .nw { white-space:nowrap; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:820px) { .g2, .g4 { grid-template-columns:1fr 1fr; } .g2 { grid-template-columns:1fr; } }

  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; }
  .stat .n { font-size:1.6rem; font-weight:bold; color:var(--navy); }
  .stat .l { font-size:.8rem; color:var(--muted); }
  .stat.alert .n { color:var(--error); }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .grow { flex:1; min-width:180px; }
  input[type=text], input[type=date], input[type=email], input[type=tel], input[type=password], select, textarea {
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
  .toolbar select { width:auto; }

  .btn { padding:8px 14px; border-radius:6px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; white-space:nowrap; }
  .btn.ghost { background:#fff; color:var(--navy); }
  a.btn { display:inline-block; text-decoration:none; }
  .btn.danger { background:#fff; color:var(--error); border-color:var(--error); }
  .btn.sm { padding:4px 9px; font-size:.8rem; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--soft); vertical-align:top; }
  th { font-size:.78rem; color:var(--muted); font-weight:normal; white-space:nowrap; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:#fafbfd; }
  .tbl-wrap { overflow-x:auto; }

  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.75rem; background:var(--soft); color:#333; white-space:nowrap; }
  .pill.s-상담중 { background:var(--soft); color:#374151; }
  .pill.s-진행중 { background:#e6f6ef; color:#0f7a55; }
  .pill.s-보류 { background:#fff4e0; color:#a56200; }

  .pill.a-합격 { background:#e6f6ef; color:#0f7a55; }

  .dday.far { color:#8a919e; font-weight:normal; }
  .muted { color:var(--muted); font-size:.82rem; }

  .empty { color:var(--muted); text-align:center; padding:18px; font-size:.85rem; }

  .tabs { display:flex; gap:4px; border-bottom:2px solid var(--soft); margin-bottom:12px; }
  .tabs a { padding:8px 14px; text-decoration:none; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; }
  .tabs a.on { color:var(--navy); border-color:var(--gold); font-weight:bold; }

  .note { border-left:3px solid var(--gold); padding:8px 12px; margin-bottom:12px; background:#fcfcfd; border-radius:0 6px 6px 0; }

  .note .next { margin-top:6px; font-size:.85rem; background:#fffaf0; padding:6px 8px; border-radius:4px; }
  .note .acts { margin-left:auto; display:flex; gap:4px; }

  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:.88rem; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; white-space:pre-wrap; word-break:break-all; }

  .todo { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--soft); }
  .todo input { margin-top:3px; width:16px; height:16px; }
  .todo .t { flex:1; }

  /* modal */
  .ov { position:fixed; inset:0; background:rgba(11,27,69,.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:30px 12px; overflow-y:auto; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:620px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size:1.05rem; margin-bottom:14px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .form .full { grid-column:1 / -1; }
  .form label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:3px; }

  .modal .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:8px; z-index:60; display:none; max-width:90vw; font-size:.88rem; }
  #toast.err { background:var(--error); }

  .login .logo span { color:var(--gold); }
  .login label { display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px; }
  .login .btn { width:100%; margin-top:18px; padding:12px; font-size:1rem; }
  .login .msg { color:var(--error); font-size:.85rem; min-height:20px; margin-top:10px; }
  .tabs { overflow-x:auto; }

  .sec-h { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:0 0 10px; }

  .multi { display:flex; flex-wrap:wrap; gap:6px 14px; padding:4px 0; }
  .form .multi label { display:inline-flex; align-items:center; gap:4px; font-size:.86rem; color:#222; margin:0; }
  .role { font-size:.72rem; padding:1px 6px; border-radius:4px; background:#5a6890; color:#fff; }
  .contract { border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:10px; cursor:pointer; }

  .money { font-weight:bold; color:var(--navy); }

  .pill.p-미납 { background:#fdecec; color:#b42318; }
  .pill.d-수합 { background:#e6f6ef; color:#0f7a55; }

  .pill.d-미확정 { background:#fdecec; color:#b42318; }
  .pill.prog { background:#fff; color:var(--navy); border:1px solid #c7cbd6; }
  .chks { margin-top:10px; padding-top:10px; border-top:1px solid var(--soft); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chk { font-size:.75rem; padding:2px 9px; border-radius:10px; cursor:pointer; border:1px solid var(--border); }
  .chk.ok { background:#e6f6ef; color:#0f7a55; border-color:#bfe6d3; }
  .chk.no { background:#fff; color:#9aa0aa; border-style:dashed; }
  .cbar { display:inline-block; width:54px; height:6px; background:var(--soft); border-radius:3px; vertical-align:middle; overflow:hidden; }
  .cbar span { display:block; height:100%; background:var(--ok); }
  table.mat th.c, table.mat td.c { text-align:center; }
  .mk { display:inline-block; width:26px; height:26px; line-height:26px; border-radius:50%; cursor:pointer; font-weight:bold; }
  .mk.ok { background:#e6f6ef; color:#0f7a55; }
  .mk.no { color:#c4c8cf; }
  tr.grp td { background:var(--soft); font-weight:bold; color:var(--navy); font-size:.85rem; }
  .pays { margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); }
  .form .fh { font-size:.82rem; font-weight:bold; color:var(--navy); border-top:1px solid var(--soft); padding-top:10px; margin-top:4px; }
  .form .fh:empty { padding-top:0; }
  .owners { margin-left:6px; padding:1px 8px; background:var(--soft); border-radius:10px; font-size:.75rem; color:#444; }
  .pill.prem { background:#C9A227; color:#0B1B45; font-weight:bold; }
  .progress-box { margin-top:10px; padding:8px 12px; background:#f7f9fc; border-left:3px solid var(--navy); border-radius:0 6px 6px 0; font-size:.88rem; white-space:pre-wrap; }
  .progress-box .btn { margin-left:6px; }

  .quick { display:grid; grid-template-columns:1fr 150px 140px auto; gap:6px; margin-bottom:10px; }
  @media (max-width:640px) { .quick { grid-template-columns:1fr 1fr; } .quick input[type=text] { grid-column:1 / -1; } }
  .fu { display:flex; gap:10px; padding:8px 4px; border-bottom:1px solid var(--soft); align-items:flex-start; }
  .fu input { margin-top:4px; width:16px; height:16px; flex-shrink:0; }

  .donebox { margin-top:10px; } .donebox summary { cursor:pointer; color:var(--muted); font-size:.85rem; }
  .acts-list { max-height:320px; overflow-y:auto; }

  .scroll-box { max-height:340px; overflow-y:auto; }
  .scroll-box.sm { max-height:260px; }

  table.compact td, table.compact th { padding:6px 6px; }
  .gsearch { position:relative; flex:0 1 440px; min-width:180px; margin-left:auto; }
  @media (max-width:700px) { .gsearch { order:3; flex:1 1 100%; margin-left:0; } .um { margin-left:auto; } }

/* ============================== 상태 ============================== */
var S = { me: null, teachers: [], students: [], loadedAt: 0 };
CHILD.forEach(function (t) { S[t] = []; });
var UI = { q: '', status: 'active', counselor: 'all', track: '', tab: '', dlRange: '60', dlHideDone: true,
  log: null, logQ: '', logWho: '', logTbl: '', logAct: '', logLogin: false, trash: null };

function isMgr() { return S.me && (S.me.role === 'admin' || S.me.role === 'staff'); }
function isAdmin() { return S.me && S.me.role === 'admin'; }

/* ============================== 서버 호출 ============================== */
function post(url, body) {
  busy(true);
  return fetch(url, { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'revera' }, body: JSON.stringify(body || {}) })
    .then(function (res) { return handle(res); }, function () { busy(false); throw new Error('서버에 연결할 수 없습니다. 인터넷(VPN) 연결을 확인하세요.'); });
}
function handle(res) {
  return res.json().catch(function () { return {}; }).then(function (data) {
    busy(false);
    if (res.ok) return data;
    if (data.needLogin) showLogin();
    var e = new Error(data.error || ('서버 오류 (' + res.status + ')')); e.needLogin = !!data.needLogin; throw e;
  });
}
function api(fn, arg) { return post('/api/rpc/' + fn, { arg: arg }); }
var busyCount = 0;
function busy(on) { busyCount = Math.max(0, busyCount + (on ? 1 : -1)); $('loading').style.display = busyCount > 0 ? 'block' : 'none'; }
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }

function load(data) {
  S.me = data.me; S.teachers = data.teachers; S.students = data.students; S.loadedAt = Date.now();
  CHILD.forEach(function (t) { S[t] = data[t] || []; });
  S.options = data.options || [];
  S.events = data.events || [];
  S.unifiles = data.unifiles || [];
  UI.pw = {};
  UI.activity = {}; // 최근 활동은 저장할 때마다 새로 불러옴
  $('whoami').textContent = S.me.name;
  $('um-av').textContent = String(S.me.name || '?').trim().slice(0, 1);
  $('um-h').innerHTML = '<b>' + esc(S.me.name) + '</b> · ' + esc(ROLE_LABEL[S.me.role] || S.me.role) + '<br>' + esc(S.me.email);
  $('who').style.display = ''; $('gs').style.display = ''; $('rf').style.display = '';
  render();
  if (S.me.mustChangePassword) openPasswordForm(true);
}
function refresh(manual) {
  return api('getAll').then(function (d) { load(d); if (manual) toast('최신 데이터로 새로고침했습니다.'); })
    .catch(function (e) {
      if (e.needLogin) return;
      if (!S.me) $('app').innerHTML = '<div id="gate"><div class="card"><h3>접속할 수 없습니다</h3><p>' + esc(errMsg(e)) + '</p></div></div>';
      else toast(errMsg(e), true);
    });
}
/** 저장 계열 호출: 성공 시 전체 데이터 갱신 후 응답을 돌려줌(실패 시 null) */
function mutate(fn, arg, okMsg) {
  return api(fn, arg).then(function (d) { load(d); closeModal(true); if (okMsg) toast(okMsg); return d; })
    .catch(function (e) { toast(errMsg(e), true); return null; });
}

/* ============================== 로그인 ============================== */
function showLogin() {
  S.me = null; closeModal(true);
  $('who').style.display = 'none'; $('gs').style.display = 'none'; $('rf').style.display = 'none'; $('nav').innerHTML = '';
  $('app').innerHTML = '<div id="gate"><form class="card login" onsubmit="doLogin(event)">' +
    '<div class="logo">REVERA <span>Compass</span></div>' +
    '<label>이메일</label><input type="email" id="lg-email" autocomplete="username" required>' +
    '<label>비밀번호</label><input type="password" id="lg-pw" autocomplete="current-password" required>' +
    '<button class="btn" type="submit">로그인</button><div class="msg" id="lg-msg"></div>' +
    '<div class="muted">계정이 없거나 비밀번호를 잊었다면 관리자에게 요청하세요.</div></form></div>';
  $('lg-email').focus();
}
function doLogin(ev) {
  ev.preventDefault();
  $('lg-msg').textContent = '';
  post('/api/login', { email: $('lg-email').value.trim(), password: $('lg-pw').value })
    .then(function () { return refresh(); })
    .catch(function (e) { $('lg-msg').textContent = errMsg(e); $('lg-pw').value = ''; $('lg-pw').focus(); });
}
function logout() { post('/api/logout').then(showLogin, showLogin); }
function openPasswordForm(forced) {
  modal(forced ? '처음 로그인 — 비밀번호를 변경해주세요' : '비밀번호 변경',

function openFollowups(sid) {
  return S.followups.filter(function (f) { return (!sid || f.studentId === sid) && f.status !== '완료' && studentById(f.studentId); })
    .sort(function (a, b) { return (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt.localeCompare(b.createdAt); });
}
function fuStatusPill(f) {
  var cls = f.status === '완료' ? 'd-수합' : f.status === '진행 중' ? 's-진행중' : f.status === '대기' ? 'd-요청함' : '';
  return '<span class="pill ' + cls + '">' + esc(f.status) + '</span>';
}
function fuRow(f, showStudent, inSource) {
  var s = studentById(f.studentId), done = f.status === '완료';
  var src = inSource ? null : f.meetingId ? findRow('meetings', f.meetingId) : f.noteId ? findRow('notes', f.noteId) : null;
  var reqTag = f.requestedBy && !done ? '<span class="req" title="' + esc(fmtTime(f.requestedAt) + (f.requestNote ? ' · ' + f.requestNote : '')) + '">↪ ' + esc(teacherName(f.requestedBy)) + ' 요청</span>' : '';
  var reply = f.reply || f.replyFrom ? '💬 ' + (f.replyFrom || '답변') + (f.replyDate ? ' ' + fmtD(f.replyDate) : '') + (f.reply ? ': ' + f.reply : '') : '';
  return '<div class="fu' + (done ? ' done' : '') + (!done && f.due && dayDiff(f.due) < 0 ? ' over' : '') + '">' +
    '<input type="checkbox" title="완료 처리"' + (done ? ' checked' : '') + ' onchange="toggleFollowup(' + js(f.id) + ', this.checked)">' +
    '<div class="t" onclick="openForm(\'followups\',' + js(f.id) + ')" title="' + esc([f.detail, reply].filter(Boolean).join('\n')) + '">' +
      '<div class="l1"><span class="tt">' + esc(f.title) + '</span>' + (f.category ? '<span class="tag">' + esc(f.category) + '</span>' : '') +
        (!done && f.status !== '할 일' ? fuStatusPill(f) : '') + reqTag +
        (src ? '<span class="linked">' + (f.meetingId ? '미팅 ' : '상담 ') + esc(fmtD(src.date)) + '</span>' : '') +
        '<span class="meta">' + (showStudent ? '<a href="#/student/' + esc(s.id) + '" onclick="event.stopPropagation();UI.tab=\'followups\'"><b>' + esc(s.name) + '</b></a> · ' : '') +
        esc(teacherName(f.assignee) || '담당 미정') +
        (done ? ' · ' + esc(fmtTime(f.doneAt).slice(5, 10).replace('-', '/')) + ' 완료' : f.due ? ' · ' + esc(fmtD(f.due)) + ' ' + dday(f.due) : ' · 기한 없음') + '</span></div>' +
      (reply ? '<div class="l2 rp">' + esc(reply) + '</div>' : f.detail ? '<div class="l2">' + esc(f.detail) + '</div>' : '') +
      (f.requestNote && !done && f.assignee === S.me.email ? '<div class="l2" style="color:#7a4d00">↪ ' + esc(f.requestNote) + '</div>' : '') +
    '</div>' + (done ? '' : '<button type="button" class="ibtn" title="다른 선생님에게 요청 (휴무 등)" onclick="openRequest(' + js(f.id) + ')">↪ 요청</button>') +
    '<button type="button" class="ibtn" title="학생·학부모 답변 기록" onclick="openForm(\'fureply\',' + js(f.id) + ')">💬</button></div>';
}
/** 팔로업을 다른 선생님에게 요청 — 담당자가 바뀌고, 이메일 알림이 켜져 있으면 바로 메일 */
function openRequest(id) {
  var f = findRow('followups', id); if (!f) return toast('팔로업을 찾을 수 없습니다. 새로고침 해주세요.', true);
  var s = studentById(f.studentId);
  var who = S.teachers.filter(function (t) { return t.active && t.email !== f.assignee && (t.role !== 'consultant' || String(s.counselor).toLowerCase() === t.email); });
  modal('다른 선생님에게 요청 — ' + s.name,
    '<div class="full"><b>' + esc(f.title) + '</b><div class="muted">지금 담당: ' + esc(teacherName(f.assignee) || '미정') + (f.due ? ' · 기한 ' + esc(fmtD(f.due)) : '') + '</div></div>' +
    fld('받을 선생님', '<select name="to">' + (who.length ? who.map(function (t) { return '<option value="' + esc(t.email) + '">' + esc(t.name) + ' (' + esc(ROLE_LABEL[t.role] || t.role) + ')' + (t.notify ? '' : ' — 메일 알림 꺼짐') + '</option>'; }).join('') : '<option value="">요청할 수 있는 선생님이 없습니다</option>') + '</select>', true, true) +
    fld('메모 (받는 분께 보이고 메일에도 들어감)', '<textarea name="note" placeholder="예: 저 이번 주 휴무라 대신 챙겨주세요. 학부모님께는 월요일에 연락드리기로 했습니다."></textarea>', true) +
    '<div class="full muted">담당자가 받는 분으로 바뀌고, 그분의 메인 화면 “오늘 챙길 일” 맨 위에 “요청받은 일”로 나옵니다. 컨설턴트는 담당 학생만 볼 수 있어서, 이 학생의 담당 컨설턴트가 아닌 분은 목록에 없습니다.</div>',
    '<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" onclick="submitRequest(' + js(id) + ')">요청하기</button>');
}
function submitRequest(id) {
  var f = findRow('followups', id), o = formData($('mf'));
  if (!o.to) return toast('받을 선생님을 고르세요.', true);
  api('requestFollowup', { id: id, to: o.to, note: o.note, updatedAt: f && f.updatedAt }).then(function (d) {
    load(d); closeModal(true);
    toast(teacherName(o.to) + ' 님에게 요청했습니다.' + (d.mail ? ' ' + d.mail.note : ''), d.mail && !d.mail.sent && /보내지 못했/.test(d.mail.note));
  }).catch(function (e) { toast(errMsg(e), true); });
}
function toggleFollowup(id, done) {
  var f = findRow('followups', id);
  if (!f) return;
  mutate('save', { table: 'followups', obj: { id: f.id, updatedAt: f.updatedAt, status: done ? '완료' : '할 일' } }, done ? '완료 처리했습니다.' : '다시 할 일로 되돌렸습니다.');
}
function quickFollowup(sid) {
  var t = $('fu-title'); if (!t || !t.value.trim()) return toast('할 일을 입력하세요.', true);
  mutate('save', { table: 'followups', obj: { studentId: sid, title: t.value.trim(), assignee: $('fu-who') ? $('fu-who').value : S.me.email, due: $('fu-due') ? $('fu-due').value : '', status: '할 일' } }, '팔로업을 추가했습니다.');
}
function tabFollowups(s) {
  var all = S.followups.filter(function (f) { return f.studentId === s.id; });
  var open = openFollowups(s.id);
  var done = all.filter(function (f) { return f.status === '완료'; }).sort(function (a, b) { return (b.doneAt || '').localeCompare(a.doneAt || ''); });
  var h = '<div class="card">' + secHead('팔로업 <span class="muted">남은 ' + open.length + '건</span>', '<button class="btn ghost sm" onclick="openForm(\'followups\',null,' + js(s.id) + ')">자세히 추가</button>');
  h += '<div class="quick"><input type="text" id="fu-title" placeholder="챙겨야 할 일을 입력하고 Enter (예: 추천서 요청 메일 확인)" onkeydown="if(event.key===\'Enter\')quickFollowup(' + js(s.id) + ')">' +
    '<select id="fu-who" title="담당자">' + teacherOpts(S.me.email) + '</select><input type="date" id="fu-due" title="기한"><button class="btn" onclick="quickFollowup(' + js(s.id) + ')">추가</button></div>';
  h += open.length ? open.map(function (f) { return fuRow(f, false); }).join('') : '<div class="empty">남은 팔로업이 없습니다.</div>';
  if (done.length) h += '<details class="donebox"><summary>완료된 항목 ' + done.length + '건</summary>' + done.slice(0, 30).map(function (f) { return fuRow(f, false); }).join('') + '</details>';
  return h + '</div>';
}
function loadActivity(sid) {
  api('getActivity', { studentId: sid }).then(function (d) {
    UI.activity[sid] = d.rows;
    if (route().view === 'student' && route().id === sid && (UI.tab === 'summary' || UI.tab === 'majors')) render();
  }).catch(function () { UI.activity[sid] = []; });
}

/* ----- 팔로업 트래커 (전체 학생) ----- */
function viewFollowups() {
  UI.fuWho = UI.fuWho || 'me'; UI.fuStatus = UI.fuStatus || 'open'; UI.fuDue = UI.fuDue || 'all';
  var q = (UI.fuQ || '').toLowerCase();
  var list = S.followups.filter(function (f) {
    var s = studentById(f.studentId); if (!s) return false;
    if (UI.fuStatus === 'open' && f.status === '완료') return false;
    if (UI.fuStatus === 'done' && f.status !== '완료') return false;
    if (UI.fuWho === 'me' && f.assignee !== S.me.email) return false;
    if (UI.fuWho === 'mystudents' && !isMine(s)) return false;
    if (UI.fuWho === 'none' && f.assignee) return false;
    if (UI.fuWho.indexOf('@') > 0 && f.assignee !== UI.fuWho) return false;
    var n = dayDiff(f.due);
    if (UI.fuDue === 'over' && !(n !== null && n < 0)) return false;
    if (UI.fuDue === 'week' && !(n !== null && n <= 7)) return false;
    if (q && [s.name, f.title, f.detail, f.category, teacherName(f.assignee)].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt.localeCompare(b.createdAt); });
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">팔로업 트래커 <span class="muted">' + list.length + '건</span></h2></div>';
  h += '<div class="toolbar"><input type="text" id="q" class="grow" placeholder="학생·할 일·담당자 검색" value="' + esc(UI.fuQ || '') + '" oninput="searchInput(event,\'fuQ\')" oncompositionend="searchInput(event,\'fuQ\')">' +
    '<select onchange="UI.fuWho=this.value;render()">' + [['me', '내가 담당인 일'], ['mystudents', '내 담당 학생의 일'], ['all', '전체'], ['none', '담당자 미정']].map(function (o) {
      return '<option value="' + o[0] + '"' + (UI.fuWho === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      S.teachers.filter(function (t) { return t.active; }).map(function (t) { return '<option value="' + esc(t.email) + '"' + (UI.fuWho === t.email ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>' +
    '<select onchange="UI.fuStatus=this.value;render()">' + [['open', '남은 일'], ['done', '완료'], ['all', '전체']].map(function (o) {
      return '<option value="' + o[0] + '"' + (UI.fuStatus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<select onchange="UI.fuDue=this.value;render()">' + [['all', '모든 기한'], ['over', '기한 지남'], ['week', '7일 이내']].map(function (o) {
      return '<option value="' + o[0] + '"' + (UI.fuDue === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>';
  if (!list.length) return h + '<div class="card empty">해당하는 팔로업이 없습니다. 학생 화면의 “팔로업” 탭에서 추가할 수 있습니다.</div>';
  UI.fuGroup = UI.fuGroup || 'due';
  h = h.replace('</h2></div>', '</h2>' + seg([['due', '기한별로 보기'], ['student', '학생별로 보기']], UI.fuGroup, 'fuGroup') + '</div>');
  if (UI.fuGroup === 'due') {
    var buckets = [['기한 지남', 'over', function (n) { return n !== null && n < 0; }], ['오늘·내일', '', function (n) { return n === 0 || n === 1; }],
      ['이번 주 (7일 이내)', '', function (n) { return n !== null && n > 1 && n <= 7; }], ['그 이후', '', function (n) { return n !== null && n > 7; }], ['기한 없음', '', function (n) { return n === null; }]];
    if (UI.fuStatus === 'done') return h + '<div class="card">' + list.map(function (f) { return fuRow(f, true); }).join('') + '</div>';
    return h + '<div class="card">' + buckets.map(function (b) {
      var part = list.filter(function (f) { return f.status !== '완료' && b[2](dayDiff(f.due)); });
      return part.length ? '<div class="fu-grp ' + b[1] + '">' + b[0] + ' · ' + part.length + '건</div>' + part.map(function (f) { return fuRow(f, true); }).join('') : '';
    }).join('') + (UI.fuStatus === 'all' && list.some(function (f) { return f.status === '완료'; }) ? '<div class="fu-grp">완료</div>' + list.filter(function (f) { return f.status === '완료'; }).map(function (f) { return fuRow(f, true); }).join('') : '') + '</div>';
  }
  // 학생별로 묶어서, 학생의 현재 진행 상황과 함께
  var bySt = {}, order = [];
  list.forEach(function (f) { if (!bySt[f.studentId]) { bySt[f.studentId] = []; order.push(f.studentId); } bySt[f.studentId].push(f); });
  return h + order.map(function (sid) {
    var s = studentById(sid);
    return '<div class="card fu-group"><div class="sec-h"><h3><a href="#/student/' + esc(s.id) + '" onclick="UI.tab=\'followups\'">' + esc(s.name) + '</a> <span class="muted">' + esc(ownersText(s)) + '</span></h3></div>' +
      (s.progress ? '<div class="progress-line">📌 ' + esc(s.progress) + '</div>' : '') +
      bySt[sid].map(function (f) { return fuRow(f, false); }).join('') + '</div>';
  }).join('');
}

  h += '</div>';
  var files = childOf('files', s.id).filter(function (f) { return !f.docId && !f.meetingId; }).sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });

/* ----- 학력 (G1 ~ 현재) ----- */
function addDays(d, n) { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
/** 시작일~종료일(포함) 기간을 "n년 n개월 n일"로 */
function ymd(a, b) {
  var e = addDays(b, 1);
  var y = +e.slice(0, 4) - +a.slice(0, 4), m = +e.slice(5, 7) - +a.slice(5, 7), d = +e.slice(8, 10) - +a.slice(8, 10);
  if (d < 0) { m--; var pm = new Date(Date.UTC(+e.slice(0, 4), +e.slice(5, 7) - 1, 0)); d += pm.getUTCDate(); }
  if (m < 0) { y--; m += 12; }
  return [y ? y + '년' : '', m ? m + '개월' : '', d ? d + '일' : ''].filter(Boolean).join(' ') || '0일';
}
function tabSchools(s) {
  var list = childOf('schools', s.id).sort(byDate('startDate'));
  var h = '<div class="card">' + secHead('학력 <span class="muted">G1부터 현재까지 · 원서 작업 기준</span>', addBtn('schools', s.id, '+ 학교 추가'));
  if (!list.length) return h + '<div class="empty">아직 입력된 학력이 없습니다. 초등학교(G1)부터 학교·학년·날짜를 순서대로 입력하세요.</div></div>';
  var byCountry = {}, overlap = false, rows = '';
  list.forEach(function (r, i) {
    var end = r.endDate || today();
    if (i > 0) {
      var p = list[i - 1], pend = p.endDate || today();
      var gap = daysBetween(pend, r.startDate) - 1;
      if (gap > 0) rows += '<tr class="gap"><td colspan="6">⚠ 공백 ' + gap + '일 (' + esc(addDays(pend, 1)) + ' ~ ' + esc(addDays(r.startDate, -1)) + ') — 방학이면 메모에 남겨두세요</td></tr>';
      if (r.startDate <= pend) { overlap = true; rows += '<tr class="gap"><td colspan="6">⚠ 앞 학교와 기간이 겹칩니다 (' + esc(r.startDate) + ' ≤ ' + esc(pend) + ')</td></tr>'; }
    }
    var days = daysBetween(r.startDate, end) + 1;
    var c = r.country || '국가 미입력'; byCountry[c] = (byCountry[c] || 0) + days;
    rows += '<tr class="click" onclick="openForm(\'schools\',' + js(r.id) + ')"><td><b>' + esc(r.school) + '</b>' + (r.memo ? '<div class="muted" style="white-space:pre-wrap">' + esc(r.memo) + '</div>' : '') + '</td>' +
      '<td class="nw">' + esc([r.country, r.city].filter(Boolean).join(' · ')) + '</td><td class="nw">' + esc([r.gradeFrom, r.gradeTo].filter(Boolean).join(' ~ ')) + '</td>' +
      '<td class="nw">' + esc(r.startDate) + ' ~ ' + (r.endDate ? esc(r.endDate) : '<b>재학 중</b>') + '</td><td class="nw">' + ymd(r.startDate, end) + '</td><td class="nw muted">' + days + '일</td></tr>';
  });
  h += '<div class="tbl-wrap"><table><thead><tr><th>학교</th><th>국가·도시</th><th>학년</th><th>기간</th><th>재학 기간</th><th>일수</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  h += '<div class="muted" style="margin-top:8px;font-size:.85rem">국가별 합계: ' + Object.keys(byCountry).map(function (c) { return esc(c) + ' ' + byCountry[c] + '일'; }).join(' · ') +
    ' <span>(시작일·종료일 포함, 재학 중은 오늘까지' + (overlap ? ', 겹치는 기간은 중복 합산' : '') + ')</span></div>';
  return h + '</div>';
}

function uploadFiles(input, studentId, docId, meetingId) {
  var files = Array.prototype.slice.call(input.files);
  var cat = ($('upcat') || {}).value || '성적표';
  input.value = '';
  var ok = 0, chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (f.size > 20 * 1024 * 1024) { toast(f.name + ': 20MB를 넘는 파일은 올릴 수 없습니다.', true); return; }
      busy(true);
      return fetch('/api/files/upload?studentId=' + encodeURIComponent(studentId) + '&category=' + encodeURIComponent(cat) + (docId ? '&docId=' + encodeURIComponent(docId) : '') + (meetingId ? '&meetingId=' + encodeURIComponent(meetingId) : ''), {
        method: 'POST', credentials: 'same-origin', body: f,
        headers: { 'X-Requested-With': 'revera', 'X-File-Name': encodeURIComponent(f.name), 'Content-Type': f.type || 'application/octet-stream' }
      }).then(handle, function () { busy(false); throw new Error('서버에 연결할 수 없습니다.'); })
        .then(function (d) { load(d); ok++; })
        .catch(function (e) { toast(f.name + ': ' + errMsg(e), true); });
    });
  });
  chain.then(function () { if (ok) toast(ok + '개 파일을 올렸습니다.' + (docId ? ' 서류가 수합 완료로 바뀌었습니다.' : '')); });
}

    .map(function (f) { var s = studentById(f.studentId); return { title: s.name + ' — ' + f.title, sub: [f.status, '담당 ' + (teacherName(f.assignee) || '미정'), f.due].filter(Boolean).join(' · '), href: '#/student/' + s.id, tab: 'followups' }; });

  h += '<div class="muted" style="margin-bottom:10px">지원대학 진행 상태가 제출완료·대기·합격·불합격인 건을 모았습니다. 연도는 지원 마감일 기준입니다.' + (isMgr() ? '' : ' (담당 학생만)') + '</div>';

  var tot = function (arr, st) { return arr.filter(function (a) { return a.status === st; }).length; };
  h += '<div class="grid g4" style="margin-bottom:14px">' + stat(list.length, '제출', '') + stat(tot(list, '합격'), '합격', '') +

  var cs = Object.keys(byC).sort(function (a, b) { return (COUNTRIES.indexOf(a) + 1 || 99) - (COUNTRIES.indexOf(b) + 1 || 99); });
  h += '<div class="card tbl-wrap"><table><thead><tr><th>대학</th><th>제출</th><th>합격</th><th>불합격</th><th>결과 대기</th><th>합격 학생</th></tr></thead><tbody>' +
    cs.map(function (c) {

/* ============================== 매출 (관리자·관리팀) ============================== */
function viewSales() {
  if (!isMgr()) return '<div class="card empty">관리자·관리팀만 볼 수 있습니다.</div>';
  var tot = {};
  CURRENCIES.forEach(function (c) { tot[c] = { paid: 0, contract: 0, due: 0 }; });
  S.contracts.forEach(function (c) {
    if (!studentById(c.studentId)) return;
    var p = contractPay(c); tot[p.cur] = tot[p.cur] || { paid: 0, contract: 0, due: 0 };
    tot[p.cur].contract += p.total; tot[p.cur].due += p.due;
  });
  var pays = S.payments.filter(function (p) { return studentById(p.studentId); });
  pays.forEach(function (p) { var c = p.currency || 'RMB'; tot[c] = tot[c] || { paid: 0, contract: 0, due: 0 }; tot[c].paid += amt(p.amount); });
  var unpaid = unpaidContracts(), rn = renewals();
  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">매출</h2><span class="muted">입금일 기준 · 통화별로 따로 합산</span></div>';
  h += '<div class="grid g4" style="margin-bottom:14px">' + Object.keys(tot).filter(function (c) { return tot[c].paid || tot[c].contract; }).map(function (c) {
    return '<div class="stat"><div class="l">' + c + ' 전체 매출(입금)</div><div class="n">' + Math.round(tot[c].paid).toLocaleString('ko-KR') + '</div>' +
      '<div class="l">계약 ' + Math.round(tot[c].contract).toLocaleString('ko-KR') + ' · <span style="color:' + (tot[c].due ? 'var(--error)' : 'inherit') + '">미수금 ' + Math.round(tot[c].due).toLocaleString('ko-KR') + '</span></div></div>';
  }).join('') + '</div>';
  if (!S.contracts.length) h += '<div class="notice">아직 금액이 입력된 계약이 없습니다. 학생 → 계약 탭에서 계약 금액과 입금 기록을 넣으면 여기에 모입니다.</div>';
  h += '<div class="card">' + secHead('미수금 리마인드 <span class="muted">' + unpaid.length + '건</span>', '') +
    (unpaid.length ? '<div class="tbl-wrap">' + unpaidTable(unpaid, false) + '</div><div class="muted" style="margin-top:6px">납부 기한이 지난 건이 맨 위에 빨간색으로 표시됩니다. 기한은 계약 수정에서 “잔금 납부 기한”으로 넣을 수 있습니다.</div>'
      : '<div class="empty">미수금이 없습니다.</div>') + '</div>';
  h += '<div class="card"><h3>연간 계약 갱신 예정 <span class="muted">(두 달 안에 끝나거나 지난달 끝난 계약 중 다음 연간 계약이 없는 학생)</span></h3>' +
    (rn.length ? '<div class="tbl-wrap">' + renewalTable(rn) + '</div>' : '<div class="empty">갱신 예정인 연간 계약이 없습니다.</div>') + '</div>';
  pays.sort(function (a, b) { return (b.date + b.createdAt).localeCompare(a.date + a.createdAt); });
  h += '<div class="card"><h3>입금 내역 <span class="muted">' + pays.length + '건</span></h3>' + (pays.length ? '<div class="tbl-wrap"><table><thead><tr><th>입금일</th><th>학생</th><th>계약</th><th>금액</th><th>방법</th><th>메모</th><th>기록</th></tr></thead><tbody>' +
    pays.map(function (p) {
      var s = studentById(p.studentId);
      return '<tr class="click" onclick="openForm(\'payments\',' + js(p.id) + ')"><td class="nw">' + esc(p.date) + '</td><td class="nw"><b>' + esc(s.name) + '</b></td>' +
        '<td class="nw">' + esc(contractLabel(findRow('contracts', p.contractId))) + '</td><td class="nw"><b>' + money(amt(p.amount), p.currency) + '</b></td>' +
        '<td class="nw">' + esc(p.method) + '</td><td class="muted">' + esc(p.memo) + '</td><td class="nw muted">' + esc(teacherName(p.createdBy)) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">입금 기록이 없습니다.</div>') + '</div>';
  return h;

  var h = '<div class="toolbar"><h2 style="margin:0;margin-right:auto">휴지통 <span class="muted">' + items.length + '건</span></h2><button class="btn ghost" onclick="loadTrash()">↻ 새로고침</button></div>';
  h += '<div class="notice">삭제한 학생과 기록은 여기 보관되며 <b>복구</b>할 수 있습니다. 학생을 복구하면 그 학생의 기록도 모두 함께 돌아옵니다.' +

function loadTrash() {

    .catch(function (e) { toast(errMsg(e), true); });
}
function restoreItem(table, id) {
  mutate('restore', { table: table, id: id }, '복구했습니다.').then(function (d) { if (d) loadTrash(); });
}
function purgeItem(table, id, label) {
  if (!confirm('"' + label + '"을(를) 영구 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?')) return;
  api('purge', { table: table, id: id }).then(function (d) { UI.trash = d.items; toast('영구 삭제했습니다.'); render(); })
    .catch(function (e) { toast(errMsg(e), true); });

function importFile(input) {
  var f = input.files[0];
  input.value = '';
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var data;
    try { data = JSON.parse(r.result); } catch (e) { return toast('JSON 파일을 읽을 수 없습니다.', true); }
    var n = (data.students || []).length;
    if (!confirm('학생 ' + n + '명의 정보를 가져옵니다. 같은 이름의 학생은 건너뜁니다. 계속할까요?')) return;
    api('importData', data).then(function (d) {
      UI.importResult = d.importResult; load(d);
      toast('가져오기 완료: ' + d.importResult.created.length + '명 등록, ' + d.importResult.skipped.length + '명 건너뜀');
    }).catch(function (e) { toast(errMsg(e), true); });
  };
  r.readAsText(f, 'utf-8');
}

function openTeacherForm(email) {
  var t = email ? S.teachers.filter(function (x) { return x.email === email; })[0] : { role: 'consultant', active: true };
  var body = fld('이메일 (로그인 아이디)', inp('email', t.email, 'email', email ? ' readonly' : ' required'), false, true) + fld('이름', inp('name', t.name)) +

  var sub = table === 'payments' ? ' — ' + contractLabel(findRow('contracts', rec.contractId)) :
    table === 'unirounds' ? ' — ' + cycleLabel(findRow('unicycles', rec.cycleId)) : '';
  modal((id ? F.title + ' 수정' : F.title + ' 추가') + (st ? ' — ' + st.name : '') + (uni ? ' — ' + uni.name : '') + sub, body, foot);
  if (table === 'apps') appFormSync();
}
/** 지원대학 양식: 대학을 고르면 전형·전공 선택지를 채우고, 전형을 고르면 마감일 자동 */
function appFormSync(uniChanged) {
  var f = $('mf'); if (!f || !$('f-uni')) return;
  var uid = $('f-uni').value, u = uid ? findRow('universities', uid) : null;
  var rsel = $('f-round'), msel = $('f-major');
  var curR = uniChanged ? '' : (rsel.value || rsel.getAttribute('data-cur') || ''), curM = uniChanged ? '' : (msel.value || msel.getAttribute('data-cur') || '');
  rsel.setAttribute('data-cur', ''); msel.setAttribute('data-cur', '');
  var rounds = u ? S.unirounds.filter(function (r) { return r.universityId === uid; }) : [];
  var cycles = {}; S.unicycles.forEach(function (c) { cycles[c.id] = c; });
  rounds.sort(function (a, b) { var ca = cycles[a.cycleId] || {}, cb = cycles[b.cycleId] || {}; return (cb.year + cb.term).localeCompare(ca.year + ca.term) || (a.deadline || '9999').localeCompare(b.deadline || '9999'); });
  rsel.innerHTML = '<option value="">' + (u ? (rounds.length ? '— 전형 선택 —' : '— 등록된 전형 없음 —') : '— 대학을 먼저 선택 —') + '</option>' +
    rounds.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === curR ? ' selected' : '') + '>' + esc(cycleLabel(cycles[r.cycleId])) + ' · ' + esc(r.name) + ' (' + esc(r.deadline || '날짜 미정') + ')</option>'; }).join('');
  var majors = u ? S.unimajors.filter(function (m) { return m.universityId === uid; }).sort(function (a, b) { return a.name.localeCompare(b.name); }) : [];
  msel.innerHTML = '<option value="">' + (u ? '— 목록에 없음 (아래에 직접 입력) —' : '— 대학을 먼저 선택 —') + '</option>' +
    majors.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === curM ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('');
  rsel.disabled = !u; msel.disabled = !u;
  var set = function (name, val, lock) { var el = f.elements[name]; if (!el) return; if (lock) el.value = val; el.readOnly = lock; el.disabled = false; if (el.tagName === 'SELECT') el.disabled = lock; };
  set('university', u ? u.name : f.elements.university.value, !!u);
  set('country', u ? u.country : f.elements.country.value, !!u);
  var r = rsel.value ? findRow('unirounds', rsel.value) : null, m = msel.value ? findRow('unimajors', msel.value) : null;
  set('round', r ? r.name : f.elements.round.value, !!r);
  set('major', m ? m.name : f.elements.major.value, !!m);
  var manual = f.elements.deadlineManual && f.elements.deadlineManual.checked;
  if (r && !manual) f.elements.deadline.value = r.deadline || '';
  f.elements.deadline.readOnly = !!(r && !manual);
  if (f.elements.deadlineManual) f.elements.deadlineManual.closest('div').parentNode.style.display = r ? '' : 'none';
  if (f.elements.country.disabled) f.elements.country.disabled = false;
  if (u) f.elements.country.setAttribute('data-locked', '1'); else f.elements.country.removeAttribute('data-locked');
  f.elements.country.style.pointerEvents = u ? 'none' : ''; f.elements.country.style.background = u ? 'var(--soft)' : '';
}
var MGR_ONLY_FORMS = ['notes', 'contracts', 'payments'];
/** 미팅·상담기록 양식의 "팔로업" 칸: 이미 연결된 팔로업 + 새로 추가할 줄(할 일 · 담당자 · 기한) */
function linkedFollowups(table, id) {
  if (!id) return [];
  return S.followups.filter(function (f) { return table === 'meetings' ? f.meetingId === id : f.noteId === id; })
    .sort(function (a, b) { return (a.status === '완료') - (b.status === '완료') || a.createdAt.localeCompare(b.createdAt); });
}
function furowsField(table, rec) {
  var have = linkedFollowups(table, rec.id);
  return '<div class="full fh">팔로업 — 이 ' + (table === 'meetings' ? '미팅' : '상담') + '에서 나온 할 일 <span class="muted" style="font-weight:normal">(저장하면 팔로업에 추가되고, 담당자의 “오늘 챙길 일”·메일에 나옵니다)</span></div>' +
    (have.length ? '<div class="full">' + have.map(function (f) {
      return '<div class="muted" style="padding:2px 0">' + (f.status === '완료' ? '✓ ' : '• ') + '<b style="color:#222">' + esc(f.title) + '</b> · ' + esc(teacherName(f.assignee) || '담당 미정') +
        (f.due ? ' · ' + esc(fmtD(f.due)) : '') + ' · ' + esc(f.status) + '</div>';
    }).join('') + '<div class="muted" style="font-size:.75rem">이미 추가된 팔로업은 팔로업 탭에서 고칠 수 있습니다.</div></div>' : '') +
    '<div class="full furows" id="furows">' + furow() + '</div>' +
    '<div class="full"><button type="button" class="btn ghost sm" onclick="$(\'furows\').insertAdjacentHTML(\'beforeend\', furow())">+ 팔로업 줄 추가</button></div>';
}
function furow() {
  return '<div class="furow"><input type="text" data-f="title" placeholder="할 일 (예: 추천서 요청 메일 보내기)">' +
    '<select data-f="assignee" title="담당자">' + teacherOpts(S.me.email) + '</select><input type="date" data-f="due" title="기한">' +
    '<button type="button" class="btn ghost sm" onclick="this.parentNode.remove()">삭제</button></div>';
}
function furowsData() {
  return Array.prototype.map.call(document.querySelectorAll('#furows .furow'), function (r) {
    var g = function (k) { return r.querySelector('[data-f=' + k + ']').value.trim(); };
    return { title: g('title'), assignee: g('assignee'), due: g('due') };
  });
}
function submitForm(key) {
  var F = FORMS[key], table = F.table || key;
  var o = formData($('mf'));
  var miss = F.fields.filter(function (f) { return f.req && f.t !== 'uni' && !(f.mgr && !isMgr()) && !String(o[f.k] || '').trim(); })[0];
  if (table === 'apps' && !o.universityId && !(o.id && o.university)) return toast('대학을 목록에서 선택하세요.', true);
  if (table === 'payments' && !(amt(o.amount) > 0)) return toast('입금액을 숫자로 입력하세요.', true);
  if (key === 'unicycles') {
    o.requirements = JSON.stringify(Array.prototype.map.call(document.querySelectorAll('#reqs .reqrow'), function (row) {
      return { item: row.querySelector('[data-req=item]').value.trim(), content: row.querySelector('[data-req=content]').value.trim() };
    }).filter(function (x) { return x.item || x.content; }));
  }
  if (miss) return toast(miss.l + ' 항목을 입력하세요.', true);
  if (table === 'meetings') o.status = '완료';
  var fus = table === 'meetings' || table === 'notes' ? furowsData() : null;
  if (fus) {
    var bad = fus.filter(function (f) { return !f.title && (f.due || f.assignee !== S.me.email); })[0];
    if (bad) return toast('팔로업의 “할 일”을 입력하거나 그 줄을 지우세요.', true);
    fus = fus.filter(function (f) { return f.title; });
  }
  if (table === 'notes' && !o.content && !o.nextAction && !fus.length) return toast('상담 내용을 입력하거나 팔로업을 추가하세요.', true);
  (fus ? mutate('saveWithFollowups', { table: table, obj: o, followups: fus }, fus.length ? '저장했습니다. 팔로업 ' + fus.length + '건도 추가했습니다.' : '저장했습니다.')
    : mutate('save', { table: table, obj: o }, '저장했습니다.')).then(function (d) {
    if (d && table === 'students' && !o.id && d.savedId) openStudent(d.savedId);
    if (d && table === 'universities' && !o.id && d.savedId && route().view !== 'unilist') go('#/uni/' + d.savedId);
    if (d && table === 'unicycles' && d.savedId) { UI.uniCycle = UI.uniCycle || {}; UI.uniCycle[o.universityId || findRow('unicycles', d.savedId).universityId] = d.savedId; render(); }
  });
}
function delItem(table, id) {
  var label = table === 'students' ? '이 학생과 학생의 모든 기록을' : '이 항목을';
  if (!confirm(label + ' 휴지통으로 옮깁니다.\n관리자·관리팀이 휴지통에서 복구할 수 있습니다. 계속할까요?')) return;
  UI.trash = null;
  mutate('remove', { table: table, id: id }, '휴지통으로 옮겼습니다.').then(function (d) {
    if (d && table === 'students') go('#/students');
    if (d && table === 'universities') go('#/unis');
  });
}

/* ============================== 시작 ============================== */
// 목록 관리: 줄을 끌어서 순서 바꾸기 (같은 표·같은 묶음 안에서만) → 놓으면 저장
var drag = null;
document.addEventListener('dragstart', function (e) {
  var tr = e.target.closest && e.target.closest('tr.drag'); if (!tr) return;
  drag = { tr: tr, before: rowOrder(tr) };
  tr.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', tr.getAttribute('data-id')); } catch (x) { /* 일부 브라우저 */ }
});
document.addEventListener('dragover', function (e) {
  if (!drag) return;
  var tr = e.target.closest && e.target.closest('tr.drag');
  if (!tr || tr === drag.tr || tr.parentNode !== drag.tr.parentNode || tr.getAttribute('data-grp') !== drag.tr.getAttribute('data-grp')) return;
  e.preventDefault();
  var r = tr.getBoundingClientRect();
  tr.parentNode.insertBefore(drag.tr, e.clientY < r.top + r.height / 2 ? tr : tr.nextSibling);
});
document.addEventListener('drop', function (e) { if (drag) e.preventDefault(); });
document.addEventListener('dragend', function () {
  if (!drag) return;
  var d = drag; drag = null;
  d.tr.classList.remove('dragging');
  var after = rowOrder(d.tr);
  if (after.join() === d.before.join()) return;
  mutate('saveOrder', { kind: d.tr.parentNode.getAttribute('data-order'), ids: after }, '순서를 저장했습니다.');
});
function rowOrder(tr) {
  return Array.prototype.filter.call(tr.parentNode.querySelectorAll('tr.drag'), function (x) { return x.getAttribute('data-grp') === tr.getAttribute('data-grp'); })
    .map(function (x) { return x.getAttribute('data-id'); });
}
// 열린 메뉴(관리 ▾, 내 이름 ▾)는 바깥을 누르면 닫힘
document.addEventListener('click', function (e) {
  ['adm', 'who'].forEach(function (id) { var el = $(id); if (el && el.classList.contains('open') && !el.contains(e.target)) el.classList.remove('open'); });
});
refresh();
// 다른 선생님의 변경사항 반영: 창이 보이고 입력 중이 아닐 때 2분마다 자동 새로고침
setInterval(function () {
  if (S.me && document.visibilityState === 'visible' && !$('modal').innerHTML && document.activeElement.id !== 'q') refresh();
}, 120000);
</script>
